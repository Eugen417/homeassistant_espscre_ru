############################################################
# ESP Screens - a CYD (ESP32-2432S028, "Cheap Yellow Display") built from this checkout:
# the bench and the manual route (README_EXTENDED.md).
#
# The screen is two packages: packages/core.yaml, which every board shares (the LVGL
# tree, the cards, the scripts, the entities), and packages/boards/cyd-2432s028.yaml
# with this board's hardware and sizes. docs/PROFILES.md says how the files fit together.
# A screen installed from ESP Screens builds the same two files over GitHub through
# packages/cyd.yaml; this file only adds what a build from a checkout needs.
#
# What to adapt before flashing: the secrets (api_encryption_key, ota_password, Wi-Fi)
# in secrets.yaml and, for another CYD variant, the pins and the touch calibration in
# the board file. Start at README.md; docs/ covers installing, calibrating and releasing.
############################################################
substitutions:
  FONT_DIR: "fonts"                                # the fonts next to this file

packages:
  core: !include packages/core.yaml
  board: !include packages/boards/cyd-2432s028.yaml

# The components of this checkout; packages/cyd.yaml takes them from GitHub.
external_components:
  - source:
      type: local
      path: components
    components: [xpt2046, smart_display]

api:
  encryption:
    key: !secret api_encryption_key

ota:
  - platform: esphome
    password: !secret ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  # Mains-powered panel: no modem sleep, so HA updates and OTA arrive without beacon latency.
  power_save_mode: none
  ap:
    ssid: "Smartdisplay Fallback Hotspot"
    password: !secret ap_password

captive_portal:
