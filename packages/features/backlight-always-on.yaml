# ESP Screens - a backlight that must never go dark, for a board that includes this file after features/backlight.yaml.
#
# The Waveshare boards light their glass through one line on an I2C expander that also enables the backlight's boost
# converter, and switching that on from a dark screen pulls the 3.3 V rail under the brownout level: on 2026-09-21
# every wake from a dark standby ended in a reset, or left the expander and the touch panel without an answer on the
# bus. So a screen with this file has no standby and no night (firmware 0.2.91+): the settings page leaves those rows
# out, ESP Screens does too (boards.json, CAN_STANDBY), and the entities below stay internal. The board's own output
# for the line never takes it low again (packages/boards/waveshare-esp32s3-43.yaml).
substitutions:
  CAN_STANDBY: "false"
  # apply_screen_settings: the light keeps its level for the settings page; the glass stays lit.
  APPLY_BACKLIGHT: |-
    id(set_backlight).execute(level, 300);

script:
  # The other boards blink the backlight four times when an alert arrives. This backlight cannot go dark and come
  # back, so an alert here arrives without blinks; the card itself is the signal.
  - id: !remove alert_flash
  - id: alert_flash
    mode: restart
    then:
      - lambda: 'ESP_LOGI("alert", "no backlight blinks on this board");'

# The settings of a screen that can go dark, kept out of Home Assistant and ESP Screens (firmware 0.2.91+). The entities
# stay in the firmware, because packages/core.yaml publishes them, but as internal ones nobody sees. They follow
# CAN_STANDBY rather than being hidden outright, so a board whose backlight was modded and whose override says
# CAN_STANDBY "true" (docs/WAVESHARE7.md) gets its Wake and Sleep buttons and standby settings back in Home Assistant.
# tests/test_easy_package.py keeps this list and CAN_STANDBY together.
switch:
  - id: !extend setting_auto_standby
    internal: ${ (CAN_STANDBY | string | lower) != "true" }
  - id: !extend setting_night_mode
    internal: ${ (CAN_STANDBY | string | lower) != "true" }
  - id: !extend setting_home_on_standby
    internal: ${ (CAN_STANDBY | string | lower) != "true" }

number:
  - id: !extend setting_standby_brightness
    internal: ${ (CAN_STANDBY | string | lower) != "true" }
  - id: !extend setting_night_brightness
    internal: ${ (CAN_STANDBY | string | lower) != "true" }
  - id: !extend setting_standby_seconds
    internal: ${ (CAN_STANDBY | string | lower) != "true" }

datetime:
  - id: !extend setting_night_start
    internal: ${ (CAN_STANDBY | string | lower) != "true" }
  - id: !extend setting_night_end
    internal: ${ (CAN_STANDBY | string | lower) != "true" }

button:
  - id: !extend wake_button
    internal: ${ (CAN_STANDBY | string | lower) != "true" }
  - id: !extend sleep_button
    internal: ${ (CAN_STANDBY | string | lower) != "true" }
