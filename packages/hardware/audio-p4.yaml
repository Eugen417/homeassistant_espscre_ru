# ESP Screens - ES8311 audio codec on the I2S bus, for ESP32-P4 boards.

i2s_audio:
  - id: ts_speaker_bus
    i2s_mclk_pin:
      number: GPIO13
      allow_other_uses: true
    i2s_bclk_pin:
      number: GPIO12
      allow_other_uses: true
    i2s_lrclk_pin:
      number: GPIO10
      allow_other_uses: true

  - id: ts_mic_bus
    i2s_mclk_pin:
      number: GPIO13
      allow_other_uses: true
    i2s_bclk_pin:
      number: GPIO12
      allow_other_uses: true
    i2s_lrclk_pin:
      number: GPIO10
      allow_other_uses: true

audio_dac:
  - platform: es8311
    id: ts_audio_dac
    i2c_id: touch_bus
    address: 0x18
    sample_rate: 16000
    bits_per_sample: 16bit
    use_mclk: true
    use_microphone: true
