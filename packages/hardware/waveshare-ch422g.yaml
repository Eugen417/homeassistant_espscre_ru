# ESP Screens - the Waveshare ESP32-S3-Touch-LCD boards whose panel, touch and backlight hang on a CH422G expander
# (the 4.3-inch and the 7-inch), for a board file that includes this one.
#
# What these boards share: the chip (hardware/esp32s3-rgb.yaml), the one I2C bus the GT911 and the CH422G share, the
# expander's lines for the panel's reset (EXIO3), the touch reset (EXIO1) and the backlight (EXIO2), and the log over
# the chip's own USB. The board file names its panel: `display: - id: !extend my_display` with ESPHome's model for it,
# and whatever that model needs besides (docs/ADDING_A_BOARD.md).
packages:
  chip: !include esp32s3-rgb.yaml

substitutions:
  # One line on the I2C expander, not a PWM pin: the panel is lit or it is not. The settings that would be a
  # percentage are a switch instead, on the screen and in ESP Screens (settings_screen::dimmable).
  BACKLIGHT_DIMMABLE: "false"

logger:
  tx_buffer_size: 2048
  # The USB-C port for logs is the chip's own USB, not a separate UART chip like the Guition has: a log over the
  # cable only comes out over USB_SERIAL_JTAG. On UART0 the log went to two header pins nobody has connected, so
  # `esphome logs --device /dev/cu.usbmodem*` stayed empty and a crash left no trace.
  hardware_uart: USB_SERIAL_JTAG

# The GT911 and the CH422G share the board's only I2C bus.
i2c:
  id: touch_bus
  sda: GPIO8
  scl: GPIO9
  scan: true

ch422g:
  - id: expander
    i2c_id: touch_bus

output:
  # The backlight is one line on the expander, not a PWM pin: the panel is lit or it is not. The firmware still
  # sets a brightness between 0 and 1, but the line goes high once, at boot, and never low again (firmware
  # 0.2.91+, features/backlight-always-on.yaml): switching the backlight's boost converter on from a dark screen
  # browns the board out, so a 0 from anywhere - a setting pushed by the app, an alert's blink, a YAML of your own -
  # leaves it lit.
  - platform: template
    id: gpio_backlight_pwm
    type: float
    write_action:
      - lambda: |-
          // One write, on an I2C expander the touch panel shares: the bus stays free for the GT911, which is
          // polled every 20 ms, and a fade that asks for a level on every frame writes nothing.
          static bool lit = false;
          if (!lit) {
            lit = true;
            id(backlight_line).set_state(true);
          }
  - platform: gpio
    id: backlight_line
    pin:
      ch422g: expander
      number: 2
      mode:
        output: true

touchscreen:
  - platform: gt911
    id: ts_touch
    i2c_id: touch_bus
    display: my_display
    update_interval: 20ms
    # The GT911's reset line hangs on the expander, like the panel's.
    reset_pin:
      ch422g: expander
      number: 1
      mode:
        output: true

# The panel: an RGB one of ESPHome's mipi_rgb models, which bring its pins and its init. Its enable pin in ESPHome's
# model is the backlight line above, which the firmware owns, so the board file names the model and not that pin.
display:
  - platform: mipi_rgb
    id: my_display
    dimensions:
      width: ${PANEL_W}
      height: ${PANEL_H}
    reset_pin:
      ch422g: expander
      number: 3
      mode:
        output: true
    update_interval: never
    auto_clear_enabled: false
