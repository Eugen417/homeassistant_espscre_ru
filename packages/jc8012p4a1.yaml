# ESP Screens - the package a Guition JC8012P4A1 (10.1 inch) builds from over GitHub. ESP Screen Manager writes
# every screen's own YAML with `packages: display: {url: <this repository>, files: [packages/jc8012p4a1.yaml]}`
# and adds the name, the Wi-Fi reference and the unique keys (docs/EASY_SETUP.md); nothing of that lives here.
#
# The screen is two packages: core.yaml, which every board shares (the LVGL tree, the cards, the scripts, the
# entities), and boards/guition-jc8012p4a1.yaml with this board's hardware and sizes. docs/PROFILES.md says how
# the files fit together. guition-jc8012p4a1.yaml builds the same two files from a checkout.
substitutions:
  FONT_DIR: "https://raw.githubusercontent.com/MaxGramser/homeassistant_espscreen/main/fonts"

packages:
  core: !include core.yaml
  board: !include boards/guition-jc8012p4a1.yaml

external_components:
  - source:
      type: git
      url: https://github.com/MaxGramser/homeassistant_espscreen.git
      ref: main
      path: components
    refresh: 0s
    components: [smart_display]
