                        text: "Tile 2"
                        styles: style_title
                        clickable: false
                    - label:
                        id: t2_value
                        x: ${TILE_VALUE_X}
                        y: ${TILE_VALUE_Y}
                        text: "—"
                        styles: style_value
                        clickable: false
              # ---------- CARD 3 ----------
              - obj:
                  id: tile3
