            - delay: 170ms
          else:
            - lvgl.widget.update: { id: tile5, bg_opa: 40% }
            - delay: 90ms
      - lvgl.widget.update: { id: tile5, bg_opa: 95% }

  # Korte bevestigingspuls na het loslaten. Draait parallel, dus vertraagt
  # de Home Assistant-actie of het openen van een overlay niet.
  - id: tile6_ack
    mode: restart
    parameters:
