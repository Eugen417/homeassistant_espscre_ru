switch:
  - platform: restart
    name: "Restart"

# Two SPI buses used by the CYD:
# - lcd: built-in display
# - my_touchscreen: built-in touch controller
spi:
  - id: lcd
    clk_pin: GPIO14
    mosi_pin: GPIO13


# I2C bus voor de GT911 capacitieve touch (2432S032C).
# scan: true laat ESPHome bij het booten loggen welke adressen er echt zitten.
i2c:
  - id: touch_i2c
    sda: GPIO33
    scl: GPIO32
    scan: true

output:
  - platform: ledc
    pin: GPIO27
    id: gpio_backlight_pwm

  - platform: ledc
    id: output_red
    pin: GPIO4
    inverted: true
  - platform: ledc
    id: output_green
    pin: GPIO16
    inverted: true
  - platform: ledc
    id: output_blue
    pin: GPIO17
    inverted: true

light:
  - platform: monochromatic
    output: gpio_backlight_pwm
    name: "Power Display Backlight"
    id: back_light
    restore_mode: ALWAYS_ON

  - platform: rgb
    name: LED
    red: output_red
    id: led
    green: output_green
    blue: output_blue
    restore_mode: ALWAYS_OFF

# Touchscreen configuration (GT911, capacitief, via I2C)
# De GT911 levert absolute coordinaten, dus geen calibration nodig.
# LVGL regelt de rotatie (zie `rotation:` in het lvgl blok) en draait
# touch-coordinaten automatisch mee.
touchscreen:
  platform: gt911
  id: ts_touch
  i2c_id: touch_i2c
  # interrupt_pin bewust weggelaten: met een hardware-interrupt zet ESPHome
  # het pollen uit, en dan komt er niets binnen. Nu pollt hij elke 50ms.
  update_interval: 50ms

  transform:
    swap_xy: ${TOUCH_SWAP_XY}
    mirror_x: ${TOUCH_MIRROR_X}
    mirror_y: ${TOUCH_MIRROR_Y}

  on_touch:
    - lambda: |-
        id(last_touch_ms) = millis();

# Display configuration (ST7789V)
display:
  - platform: mipi_spi
    id: my_display
    spi_id: lcd
    model: ST7789V
    # Zonder dit draait mipi_spi op zijn standaard van 10MHz, en dan duurt een
    # volledig scherm ~123ms: dat zie je van boven naar beneden vullen.
    # ESPHome's eigen CYD-modellen gebruiken 40MHz. 80MHz kan meestal ook.
    data_rate: 40MHz
    cs_pin: 15
    dc_pin: 2
    invert_colors: true
    update_interval: never
    auto_clear_enabled: false

    # Native panel dimensions (portrait). Do NOT swap these per orientation and
    # do NOT add a display transform — rotation is handled by LVGL below.
    # ESPHome 2026.6+ rejects a swapped transform here with "Invalid offsets".
    dimensions:
      width: 240
      height: 320

lvgl:
  displays:
    - my_display
  touchscreens:
    - touchscreen_id: ts_touch

  # De ESP32-WROOM-32 heeft geen PSRAM; een volledige framebuffer (320x240x2
  # = 153600 bytes) past niet in DRAM. 25% is de gebruikelijke waarde.
  # 12% in plaats van 25%: laat ~20KB extra aaneengesloten geheugen vrij,
  # en LVGL schaalt de stroken van een ARGB-laag mee met de beschikbare
  # tekenruimte, dus ook de gevraagde allocaties worden kleiner.
  buffer_size: 12%

  # Directe lokale feedback op de HELE UI, niet alleen op de tegels.
  # Een thema zet de stijl per widget-type, dus dit dekt in een klap alle
  # knoppen, tabs, sliders en de thermostaatring. Niet-klikbare widgets
  # komen nooit in de pressed-state, dus die blijven onaangeroerd.
  theme:
    obj:
      pressed:
        # bg_opa en NIET opa: `opa` op widget-niveau dwingt LVGL het element
        # naar een aparte laag te renderen, en die laag kost tientallen KB's
        # per ingedrukte widget. Dat liep hier het geheugen uit.
        bg_opa: 45%
    slider:
      knob:
        pressed:
          bg_opa: 65%
    arc:
      knob:
        pressed:
          bg_opa: 65%

  # LVGL owns the rotation (display + touch) since ESPHome 2026.4.
  rotation: ${LVGL_ROTATION}

  style_definitions:
    # Achtergrond: twee-stops verticale gradient in plaats van de 320x240
    # RGB565-wallpaper. Scheelt ~150 KB flash en een image-blit per hertekening,
    # wat je direct terugziet in de vloeiendheid van het scrollen.
    - id: style_bg_grad
      bg_color: ${BG_TOP_COLOR}
      bg_grad_color: ${BG_BOTTOM_COLOR}
      bg_grad_dir: VER
      bg_opa: COVER
      border_width: 0
      radius: 0

    - id: style_tile
      bg_color: 0xFFFFFF
      bg_opa: 95%
      radius: 18
      border_width: 0
      pad_left: 8
      pad_right: 8
      pad_top: 8
      pad_bottom: 8
      shadow_width: 0
      shadow_opa: 40%

    - id: style_tile_disabled
      bg_color: 0x939391
      bg_opa: 95%
      radius: 18
      border_width: 0
      pad_left: 8
      pad_right: 8
      pad_top: 8
      pad_bottom: 8
      shadow_width: 0
      shadow_opa: 25%

    - id: style_icon_circle
      bg_color: 0xFEC600
      bg_opa: COVER
      radius: 999
      border_width: 0

    - id: style_icon_circle_disabled
      bg_color: 0x7B7B6F
      bg_opa: 95%
      radius: 999
      border_width: 0

    - id: style_room
      text_font: headline
      text_color: 0xFFFFFF
      text_opa: 100%

    - id: style_time
      text_font: time_label
      text_color: 0xFFFFFF
      text_opa: 100%

    - id: style_title
      text_font: label
      text_color: 0x000000
      text_opa: 100%

    - id: style_value
      text_font: sublabel
      text_color: 0x7A7A7C
      text_opa: 100%

    - id: style_value_big
      text_font: sublabel_big
      text_color: 0xFFFFFF
      text_opa: 80%

    - id: style_title_disabled
      text_font: label
      text_color: 0xFFFFFF
      text_opa: 100%

    - id: style_value_disabled
      text_font: sublabel
      text_color: 0xD9D9D9
      text_opa: 100%

  pages:
    - id: home_page
      styles: style_bg_grad
      scrollable: false
      scrollbar_mode: 'OFF'
      widgets:
        - label:
            id: lbl_room
            x: 11
            y: ${HEADER_Y}
            text: "${ROOM_NAME}"
            styles: style_room

        - label:
            id: lbl_time
            align: TOP_RIGHT
            x: -11
            y: ${HEADER_Y}
            text: ""
            styles: style_time

        # ---------- SCROLLBAAR TEGELRASTER ----------
        # De pagina zelf scrollt niet: wallpaper-gradient, kamernaam en klok
        # blijven staan. Alleen deze transparante container schuift.
        #
        # bg_opa: TRANSP is NIET hetzelfde als widget-`opa`: het maakt geen
        # aparte renderlaag aan, dus het kost geen extra heap (zie de comment
        # bij `theme:` hierboven).
        #
        # LVGL leidt de scroll-lengte zelf af uit de posities van de tegels;
        # er is dus geen handmatige contenthoogte. Zodra een sleep de
        # scroll-limiet (10 px) passeert annuleert LVGL de klik en de
        # long-press, dus tikken en scrollen bijten elkaar niet.
        - obj:
            id: tile_scroll
            x: 0
            y: ${SCROLL_Y}
            width: ${DISPLAY_W}
            height: ${SCROLL_H}
            bg_opa: TRANSP
            border_width: 0
            pad_left: 0
            pad_right: 0
            pad_top: 0
            pad_bottom: 8
            scrollable: true
            scroll_dir: VER
            scrollbar_mode: 'OFF'
            # Geen elastisch doorveren aan de randen: dat kost extra
            # hertekeningen op een scherm dat toch al niet vloeiend scrollt.
            scroll_elastic: false
            scroll_momentum: true
            # Klikt netjes per rij in. Verbergt de lage framerate een stuk
            # beter dan vrij scrollen. Zet op NONE voor vrij scrollen.
            scroll_snap_y: START
            widgets:
              # ---------- TILE 1 ----------
              - obj:
                  id: tile1
                  x: ${GRID_COL1_X}
                  y: ${GRID_ROW1_Y}
                  width: ${TILE_W}
                  height: ${TILE_H}
                  styles: style_tile
                  scrollable: false
