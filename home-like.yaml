  TILE6_TITLE_ACTIVE_COLOR: "0x000000"             # title color when active
  TILE6_TITLE_DISABLED_COLOR: "0xFFFFFF"           # title color when inactive
  TILE6_VALUE_ACTIVE_COLOR: "0x7A7A7C"             # value color when active
  TILE6_VALUE_DISABLED_COLOR: "0xD9D9D9"           # value color when inactive

  # --- advanced settings ---
  TILE6_TAP_SERVICE: "vacuum.start"                  # optional service override, e.g. fan.toggle
  TILE6_TAP_PARAM_KEY: ""               # optional extra service parameter key
  TILE6_TAP_PARAM_VAL: ""                      # optional extra service parameter value
  # if LONGPRESS = slider:
  TILE6_LONGPRESS_SLIDER: "auto"                   # slider type: auto | brightness | percentage | cover_position
  TILE6_LONGPRESS_OFF_VALUE: "0"                   # initial slider value when entity is off
  # if LONGPRESS = action:
  TILE6_LONGPRESS_ACTION: "vacuum.s8"                       # entity_id to fire on long press
  TILE6_LONGPRESS_ACTION_TYPE: "switch"                  # entity type: light | fan | switch | scene | script | cover | climate (empty = same as TILE*_TYPE)
  TILE6_LONGPRESS_ACTION_SERVICE: "vacuum.return_to_base"               # service to call (default: activate/turn_on — set e.g. "light.toggle" to toggle instead)
  # if TYPE = climate:
  TILE6_CLIMATE_MIN_TEMP: "5.0"                  # minimum target temperature shown in the thermostat overlay
  TILE6_CLIMATE_MAX_TEMP: "30.0"                 # maximum target temperature shown in the thermostat overlay
  TILE6_CLIMATE_STEP: "0.5"                      # target temperature step size
  TILE6_CLIMATE_CURRENT_TEMP_ATTRIBUTE: "current_temperature"  # HA attribute for current room temperature
  TILE6_CLIMATE_TARGET_TEMP_ATTRIBUTE: "temperature"           # HA attribute for target temperature
  TILE6_CLIMATE_HUMIDITY_ATTRIBUTE: "current_humidity"         # HA attribute for humidity; leave as-is if unavailable
  # ============================================================
  # TILE 7  —  Tafellamp
  # Alleen-helderheid lamp (HA meldt supported_color_modes: ['brightness']),
  # dus de kleurenknop in de slider-overlay blijft vanzelf verborgen.
  # ============================================================

  # --- basic settings ---
  TILE7_ENTITY: "light.tafellamp_licht"            # main Home Assistant entity for this tile
  TILE7_STATE_ENTITY: "light.tafellamp_licht"      # entity used for active/inactive state styling
  TILE7_TITLE: "Tafellamp"                         # tile title shown in the UI
  TILE7_ICON: "\U000F06B5"                         # mdi:lamp — also listed in MDI_GLYPH_7 above
  TILE7_TYPE: "light"                              # tile type: light | fan | switch | scene | script | cover | climate
  TILE7_TAP_ACTION: "auto"                         # tap action: auto | toggle | activate | fan_toggle_preset
  TILE7_LONGPRESS: "slider"                        # long press mode: none | slider | action | vacuum
  TILE7_VALUE_MODE: "auto"                         # value mode: auto | brightness | percentage | preset | text
  TILE7_LABEL_OFF: "Uit"                           # text shown when entity is off
  TILE7_LABEL_ON: "Aan"                            # text shown for text-mode tiles when entity is on
  TILE7_ACTIVE_STATE: ""                           # optional: exact HA state that counts as "active" (empty = default "on")

  # --- colors ---
  TILE7_CIRCLE_ACTIVE_COLOR: "${ACCENT_AUTO}"            # icon circle color when active
  TILE7_CIRCLE_DISABLED_COLOR: "0x7B7B6F"          # icon circle color when inactive
  TILE7_ICON_ACTIVE_COLOR: "0xFFFFFF"              # icon color when active
  TILE7_ICON_DISABLED_COLOR: "${ACCENT_AUTO}"            # icon color when inactive
  TILE7_BG_ACTIVE_COLOR: "0xFFFFFF"                # tile background color when active
  TILE7_BG_DISABLED_COLOR: "0x939391"              # tile background color when inactive
  TILE7_TITLE_ACTIVE_COLOR: "0x000000"             # title color when active
  TILE7_TITLE_DISABLED_COLOR: "0xFFFFFF"           # title color when inactive
  TILE7_VALUE_ACTIVE_COLOR: "0x7A7A7C"             # value color when active
  TILE7_VALUE_DISABLED_COLOR: "0xD9D9D9"           # value color when inactive

  # --- advanced settings ---
  TILE7_TAP_SERVICE: ""                            # optional service override, e.g. light.toggle
  TILE7_TAP_PARAM_KEY: ""                          # optional extra service parameter key
  TILE7_TAP_PARAM_VAL: ""                          # optional extra service parameter value
  # if LONGPRESS = slider:
  TILE7_LONGPRESS_SLIDER: "auto"                   # auto = brightness voor een light
  TILE7_LONGPRESS_OFF_VALUE: "0"                   # initial slider value when entity is off
  # if LONGPRESS = action:
  TILE7_LONGPRESS_ACTION: ""                       # entity_id to fire on long press
  TILE7_LONGPRESS_ACTION_TYPE: ""                  # entity type (empty = same as TILE*_TYPE)
  TILE7_LONGPRESS_ACTION_SERVICE: ""               # service to call (default: activate/turn_on)

  # ============================================================
  # TILE 8  —  Brievenbus reset
  # input_select.brievenbus_status heeft opties ['Vol', 'Leeg'].
  # De tegel licht op zodra de status "Vol" is (ACTIVE_STATE), en een korte
  # tik zet hem terug op "Leeg" via input_select.select_option.
  # ============================================================

  # --- basic settings ---
  TILE8_ENTITY: "input_select.brievenbus_status"   # main Home Assistant entity for this tile
  TILE8_STATE_ENTITY: "input_select.brievenbus_status"  # entity used for active/inactive state styling
  TILE8_TITLE: "Brievenbus"                        # tile title shown in the UI
  TILE8_ICON: "\U000F06EE"                         # mdi:mailbox — also listed in MDI_GLYPH_8 above
  TILE8_TYPE: "switch"                             # generiek type; het echte gedrag komt uit TAP_SERVICE hieronder
  TILE8_TAP_ACTION: "activate"                     # activate + TAP_SERVICE = losse service call
  TILE8_LONGPRESS: "none"                          # long press stuurt alleen het event naar HA
  TILE8_VALUE_MODE: "text"                         # toont LABEL_ON / LABEL_OFF
  TILE8_LABEL_OFF: "Leeg"                          # text shown when entity is off / inactive
  TILE8_LABEL_ON: "Vol"                            # text shown when entity is active
  TILE8_ACTIVE_STATE: "Vol"                        # tegel is "aan" zodra de status exact "Vol" is

  # --- colors ---
  TILE8_CIRCLE_ACTIVE_COLOR: "0xE5484D"            # rood zodra er post ligt
  TILE8_CIRCLE_DISABLED_COLOR: "0x7B7B6F"          # icon circle color when inactive
  TILE8_ICON_ACTIVE_COLOR: "0xFFFFFF"              # icon color when active
  TILE8_ICON_DISABLED_COLOR: "0xE5484D"            # icon color when inactive
  TILE8_BG_ACTIVE_COLOR: "0xFFFFFF"                # tile background color when active
  TILE8_BG_DISABLED_COLOR: "0x939391"              # tile background color when inactive
  TILE8_TITLE_ACTIVE_COLOR: "0x000000"             # title color when active
  TILE8_TITLE_DISABLED_COLOR: "0xFFFFFF"           # title color when inactive
  TILE8_VALUE_ACTIVE_COLOR: "0x7A7A7C"             # value color when active
  TILE8_VALUE_DISABLED_COLOR: "0xD9D9D9"           # value color when inactive

  # --- advanced settings ---
  TILE8_TAP_SERVICE: "input_select.select_option"  # zet de input_select op een vaste optie
  TILE8_TAP_PARAM_KEY: "option"                    # parameternaam voor input_select.select_option
  TILE8_TAP_PARAM_VAL: "Leeg"                      # de "reset"-waarde
  # if LONGPRESS = slider:
  TILE8_LONGPRESS_SLIDER: "auto"                   # niet in gebruik (LONGPRESS = none)
  TILE8_LONGPRESS_OFF_VALUE: "0"                   # niet in gebruik
  # if LONGPRESS = action:
  TILE8_LONGPRESS_ACTION: ""                       # entity_id to fire on long press
  TILE8_LONGPRESS_ACTION_TYPE: ""                  # entity type (empty = same as TILE*_TYPE)
  TILE8_LONGPRESS_ACTION_SERVICE: ""               # service to call (default: activate/turn_on)

  # ============================================================
  # TILE 9 / TILE 10  —  nog vrij
  # Rij 5 van het raster (GRID_ROW5_Y) is al gedefinieerd en leeg.
  # Zie TILE_CONFIGURATION.md, sectie "Een tegel toevoegen" voor de
  # zes plekken die je per extra tegel moet invullen.
  # ============================================================


  # ============================================================
  # ORIENTATION / LAYOUT
  # Uncomment ONE preset block below, comment out the others.
  # Touch calibration values (TOUCH_CAL_*) are device-specific —
  # portrait/flipped values are approximate and may need tuning.
  #
  # LVGL_ROTATION (0/90/180/270) drives the rotation — LVGL rotates both the
  # display output and the touch coordinates (ESPHome 2026.4+). DISPLAY_W/H are
  # the *logical* (post-rotation) canvas size used by the tile layout below;
  # the physical panel is always driven at its native 240×320 (see display:).
