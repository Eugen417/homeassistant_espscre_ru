# ============================================================
# No need to edit below this line.
# All configuration is done via the substitutions above.
# Credentials are managed in secrets.yaml (see secrets.yaml.example).
# The Material Design Icons font is included at fonts/materialdesignicons-webfont.ttf (Apache 2.0).
# Source: https://github.com/Templarian/MaterialDesign-Webfont
# ============================================================

esphome:
  name: smartdisplay
  friendly_name: SmartDisplay
  on_boot:
    priority: 600
    then:
      - lambda: |-
          id(last_touch_ms) = millis();
          id(display_dimmed) = false;
      - light.turn_on:
          id: back_light
          brightness: !lambda "return atoi(\"${MAX_BRIGHTNESS}\") / 100.0f;"
      - script.execute: ui_refresh

esp32:
  board: esp32dev
  framework:
    type: arduino
    advanced:
      # ESPHome adviseert deze twee zelf in de boot-log. Samen leveren ze
      # ~40KB extra IRAM en een kleinere binary, en op dit bord telt elke KB.
      sram1_as_iram: true
      # Let op: hiermee draait deze firmware niet meer op ESP32's ouder dan
      # rev 3.1. Dit bord is 3.1, dus prima, maar niet blind overzetten.
      minimum_chip_revision: "3.1"
    version: recommended
  variant: esp32

logger:
  # Voor diagnose tijdelijk op DEBUG of VERBOSE zetten. Let op: ESPHome logt
  # zijn configuratieregels op niveau CONFIG, die zijn op INFO onzichtbaar.
  level: INFO


# Credentials are loaded from secrets.yaml — copy secrets.yaml.example to secrets.yaml and fill in your values.
api:
  encryption:
    key: !secret api_encryption_key

ota:
  - platform: esphome
    password: !secret ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: "Smartdisplay Fallback Hotspot"
    password: !secret ap_password

captive_portal:

interval:
  - interval: 1s
    then:
      - if:
          condition:
            lambda: |-
              if (std::string("${AUTO_DIM}") != "true") return false;
              if (id(display_dimmed)) return false;
              return (millis() - id(last_touch_ms)) > (atoi("${AUTO_DIM_TIMEOUT}") * 1000UL);
          then:
            - script.execute: dim_display

time:
  - platform: homeassistant
    id: homeassistant_time
    on_time:
      - seconds: 0
        minutes: /1
        then:
          - script.execute: ui_refresh

      - seconds: 0
        minutes: 0
        hours: ${NIGHT_START_HOUR}
        then:
          - if:
              condition:
                lambda: 'return id(display_dimmed);'
              then:
                - script.execute: dim_display

      - seconds: 0
        minutes: 0
        hours: ${NIGHT_END_HOUR}
        then:
          - if:
              condition:
                lambda: 'return id(display_dimmed);'
              then:
                - script.execute: dim_display

globals:
  - id: active_entity
    type: std::string
    restore_value: no

  - id: active_control_kind
    type: std::string
    restore_value: no

  - id: active_value_suffix
    type: std::string
    restore_value: no

  - id: last_touch_ms
    type: uint32_t
    restore_value: no
    initial_value: '0'

  - id: display_dimmed
    type: bool
    restore_value: no
    initial_value: 'false'

  - id: active_label_off
    type: std::string
    restore_value: no

  - id: active_label_on
    type: std::string
    restore_value: no

  - id: active_title
    type: std::string
    restore_value: no

  - id: active_icon_text
    type: std::string
    restore_value: no

  - id: active_brightness_pct
    type: int
    restore_value: no
    initial_value: '100'

  - id: active_supports_color
    type: bool
    restore_value: no
    initial_value: 'false'

  - id: active_supports_temperature
    type: bool
    restore_value: no
    initial_value: 'false'

  - id: active_color_detail_tab
    type: int
    restore_value: no
    initial_value: '0'

  - id: active_climate_current_x10
    type: int
    restore_value: no
    initial_value: '0'

  - id: active_climate_target_x10
    type: int
    restore_value: no
    initial_value: '200'

  - id: active_climate_humidity
    type: int
    restore_value: no
    initial_value: '-1'

  - id: active_climate_min_x10
    type: int
    restore_value: no
    initial_value: '50'

  - id: active_climate_max_x10
    type: int
    restore_value: no
    initial_value: '300'

  - id: active_climate_step_x10
    type: int
    restore_value: no
    initial_value: '5'

  - id: active_climate_mode
    type: std::string
    restore_value: no

  - id: active_climate_supported_modes
    type: std::string
    restore_value: no

