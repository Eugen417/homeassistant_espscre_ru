# Geheugen zichtbaar maken: dit bord heeft geen PSRAM, dus de vrije heap
# bepaalt hoeveel UI erbij kan. Verschijnt ook als entity in Home Assistant.
debug:
  update_interval: 30s

sensor:
  - platform: debug
    free:
      name: "Heap Free"
      id: heap_free
    fragmentation:
      name: "Heap Fragmentation"
    block:
