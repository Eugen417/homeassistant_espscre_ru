script:
  # Korte bevestigingspuls na het loslaten. Draait parallel, dus vertraagt
  # de Home Assistant-actie of het openen van een overlay niet.
  - id: tile1_ack
    mode: restart
    parameters:
      is_long: bool
    then:
      - if:
          condition:
            lambda: 'return is_long;'
          then:
            - lvgl.widget.update: { id: tile1, bg_opa: 20% }
            - delay: 170ms
          else:
            - lvgl.widget.update: { id: tile1, bg_opa: 40% }
            - delay: 90ms
      - lvgl.widget.update: { id: tile1, bg_opa: 95% }

  # Korte bevestigingspuls na het loslaten. Draait parallel, dus vertraagt
  # de Home Assistant-actie of het openen van een overlay niet.
