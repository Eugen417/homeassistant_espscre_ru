name: ESP Screen Manager
version: "0.2.8"
slug: esp_screen_manager
description: Kies tegels voor je CYD en Guition touchscreen, zonder opnieuw flashen.
url: https://github.com/MaxGramser/homeassistant_espscreen
arch: [aarch64, amd64]
startup: application
boot: auto
init: false
homeassistant_api: true
ingress: true
ingress_port: 8099
panel_icon: mdi:monitor-dashboard
panel_title: ESP Screens
panel_admin: true
options: {}
schema: {}

map:
  - homeassistant_config:rw
uart: true
usb: true
# Reproducible compiler/download caches; retain screens.json and user configuration.
backup_exclude:
  - '*/build/'
  - '*/platformio/'
