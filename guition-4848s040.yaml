  # --- colors ---
  TILE7_CIRCLE_ACTIVE_COLOR: "${ACCENT_AUTO}"            # icon circle color when active
  TILE7_CIRCLE_DISABLED_COLOR: "0xF0F0F0"          # icon circle color when inactive
