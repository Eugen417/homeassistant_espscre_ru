script:
  - id: capture_ui_snapshot
    mode: single
    then:
      - lambda: guition::snapshot_begin();
      - repeat:
          count: 240
          then:
            - lambda: guition::snapshot_next_row();
            - delay: 100ms
  # Render every overlay and both pages repeatedly without controlling devices.
  - id: ui_self_test
    mode: single
    then:
      - logger.log: "UI_TEST START: page/overlay render stress, no HA actions"
      - lambda: 'ESP_LOGI("ui_test", "Light sliders: %s", light_controls::self_test() ? "PASS" : "FAIL");'
      - lambda: 'id(calibration_active) = false;'
      - lvgl.page.show: home_page
      - script.execute: wake_display
      - repeat:
          count: 10
          then:
            - lambda: |-
                id(last_touch_ms) = millis();
                static unsigned test_page=0;
                id(tile_page) = runtime_tiles::enabled ? test_page++ % runtime_tiles::page_count() : 1;
            - script.execute: show_tile_page
            - delay: 300ms
            - lambda: |-
                lv_obj_update_layout(id(tile_scroll));
                const int count = runtime_tiles::enabled ? runtime_tiles::model.count : std::clamp(atoi("${TILE_COUNT}"), 1, 10);
                // Wide cards take two slots, so visibility follows the runtime packing.
                const bool paginated = runtime_tiles::enabled ? runtime_tiles::page_count() > 1 : count > 6;
                lv_obj_t* tiles[] = {id(tile1), id(tile2), id(tile3), id(tile4), id(tile5),
                                     id(tile6), id(tile7), id(tile8), id(tile9), id(tile10)};
                bool ok = guition::check_geometry(id(home_page)->obj);
                for (int i = 0; i < 10; ++i) {
                  bool visible = runtime_tiles::enabled ? i<6 && runtime_tiles::widgets[i].index<runtime_tiles::model.count : i < count && (paginated ? i >= 6 : i < 6);
                  ok = ok && (lv_obj_has_flag(tiles[i], LV_OBJ_FLAG_HIDDEN) != visible);
                }
                for (lv_obj_t* control : {id(page_prev), id(page_next), id(page_number)})
                  ok = ok && (lv_obj_has_flag(control, LV_OBJ_FLAG_HIDDEN) != paginated);
                lv_area_t nav, grid;
                lv_obj_get_coords(id(page_next), &nav);
                lv_obj_get_coords(id(tile_scroll), &grid);
                ok = ok && (!paginated || grid.y2 < nav.y1);
                if(runtime_tiles::enabled)ok = runtime_tiles::check_tile_geometry() && ok;
                ESP_LOGI("ui_test", "page_check=%s count=%d heap=%u frames=%u grid_bottom=%d nav_top=%d", ok ? "PASS" : "FAIL", count, (unsigned) esp_get_free_heap_size(), (unsigned) id(rendered_frames), grid.y2, nav.y1);
                id(tile_page) = 0;
            - script.execute: show_tile_page
            - delay: 150ms
            - lvgl.widget.show: brightness_overlay
            - delay: 150ms
            - lambda: guition::check_geometry(id(brightness_overlay));
            - lvgl.widget.hide: brightness_overlay
            - lvgl.widget.show: color_detail_overlay
            - delay: 150ms
            - lambda: guition::check_geometry(id(color_detail_overlay));
            - lvgl.widget.hide: color_detail_overlay
            - lvgl.widget.show: climate_detail_overlay
            - delay: 150ms
            - lambda: guition::check_geometry(id(climate_detail_overlay));
            - lvgl.widget.hide: climate_detail_overlay
            - lvgl.widget.show: climate_mode_overlay
            - delay: 150ms
            - lambda: guition::check_geometry(id(climate_mode_overlay));
            - lvgl.widget.hide: climate_mode_overlay
            - lvgl.widget.show: vacuum_overlay
            - delay: 150ms
            - lambda: guition::check_geometry(id(vacuum_overlay));
            - lvgl.widget.hide: vacuum_overlay
      - lambda: 'if (!id(ui_refresh).is_running()) id(ui_refresh).execute();'
      - logger.log: "UI_TEST COMPLETE"

  - id: show_tile_page
    then:
      - lambda: |-
          if(runtime_tiles::enabled){
            runtime_tiles::show_page(id(tile_page),id(page_prev),id(page_next),id(page_number));
            return;
          }
          lv_obj_t* tiles[] = {id(tile1), id(tile2), id(tile3), id(tile4), id(tile5),
                               id(tile6), id(tile7), id(tile8), id(tile9), id(tile10)};
          const int rows[] = {${GRID_ROW1_Y}, ${GRID_ROW2_Y}, ${GRID_ROW3_Y}};
          const int count = runtime_tiles::enabled ? runtime_tiles::model.count : std::clamp(atoi("${TILE_COUNT}"), 1, 10);
          const bool paginated = count > 6;
          if (!paginated) id(tile_page) = 0;
          for (lv_obj_t* control : {id(page_prev), id(page_next), id(page_number)}) {
            if (paginated) lv_obj_clear_flag(control, LV_OBJ_FLAG_HIDDEN);
            else lv_obj_add_flag(control, LV_OBJ_FLAG_HIDDEN);
          }
          for (int i = 0; i < 10; ++i) {
            bool visible = i < count && (id(tile_page) == 0 ? i < 6 : i >= 6);
            if (visible) {
              lv_obj_set_y(tiles[i], rows[(i < 6 ? i : i - 6) / 2]);
              lv_obj_clear_flag(tiles[i], LV_OBJ_FLAG_HIDDEN);
            } else {
              lv_obj_add_flag(tiles[i], LV_OBJ_FLAG_HIDDEN);
            }
          }
          lv_label_set_text(id(page_number), id(tile_page) == 0 ? "1 / 2" : "2 / 2");
          if (id(tile_page) == 0) {
            lv_obj_add_state(id(page_prev), LV_STATE_DISABLED);
            lv_obj_clear_state(id(page_next), LV_STATE_DISABLED);
          } else {
            lv_obj_clear_state(id(page_prev), LV_STATE_DISABLED);
            lv_obj_add_state(id(page_next), LV_STATE_DISABLED);
          }

  # Runtime changes do not count as touches and do not reset the idle timer.
  - id: apply_screen_settings
    mode: restart
    then:
      - lambda: |-
          const auto &settings = screen_settings::current;
          if(runtime_tiles::enabled && static_cast<unsigned>(id(screen_lvgl).get_rotation())!=runtime_tiles::rotation){
            cyd::touch_guard.consume();
            if(lv_indev_get_act())lv_indev_wait_release(lv_indev_get_act());
            id(screen_lvgl).set_rotation(static_cast<esphome::display::DisplayRotation>(runtime_tiles::rotation));
          }
          if (id(display_dimmed) && !settings.standby_enabled) {
            id(display_dimmed) = false;
          }
          auto now = id(homeassistant_time).now();
          const int minute = now.is_valid() ? now.hour * 60 + now.minute : -1;
          const int level = id(display_dimmed) ? settings.dim_level(minute) : settings.brightness;
          // Standby dims slowly; the tile redraws below no longer interrupt the hardware fade.
          id(set_backlight).execute(level, id(display_dimmed) ? 1500 : 300);
          if (id(display_dimmed)) { lv_obj_clear_flag(id(dim_wake_overlay), LV_OBJ_FLAG_HIDDEN); lv_obj_move_foreground(id(dim_wake_overlay)); }
          else lv_obj_add_flag(id(dim_wake_overlay), LV_OBJ_FLAG_HIDDEN);
          if (settings.show_clock) lv_obj_clear_flag(id(lbl_time), LV_OBJ_FLAG_HIDDEN);
          else lv_obj_add_flag(id(lbl_time), LV_OBJ_FLAG_HIDDEN);
          if (!id(ui_refresh).is_running()) id(ui_refresh).execute();

  - id: wake_display
    mode: restart
    then:
      - lambda: |-
          id(last_touch_ms) = millis();
          id(display_dimmed) = false;
          // Bijna instant omhoog. De ESPHome-standaard is 1s, en dat voelt traag
          // als je het scherm aanraakt en op licht staat te wachten.
          id(set_backlight).execute(screen_settings::current.brightness, 80);
      - lvgl.widget.hide: dim_wake_overlay
      - lvgl.widget.hide: color_detail_overlay
      - lvgl.widget.hide: climate_detail_overlay
      - lvgl.widget.hide: climate_mode_overlay
      - lvgl.widget.hide: vacuum_overlay

  # One owner for the backlight level: the LEDC fader steps the duty itself, so
  # LVGL redraws cannot make the transition stutter. A new call interrupts the
  # running fade from its current duty; afterwards ESPHome's light state is synced.
  - id: set_backlight
    mode: restart
    parameters:
      level: int
      ms: int
    then:
      - lambda: |-
          if (!backlight_fade::start(*id(gpio_backlight_pwm), *id(back_light), level / 100.0f, ms))
            id(back_light).turn_on().set_transition_length(ms).set_brightness(level / 100.0f).perform();
      - delay: !lambda "return ms + 40;"
      - lambda: backlight_fade::sync(*id(gpio_backlight_pwm), *id(back_light), level / 100.0f);

  - id: dim_display
    mode: restart
    then:
      - if:
          condition:
            lambda: 'return screen_settings::current.standby_enabled;'
          then:
            - lambda: |-
                id(display_dimmed) = true;
                id(apply_screen_settings).execute();
                if (screen_settings::current.home_on_standby) {
                  // Runtime detail cards live above the tile grid, so paging alone cannot close them.
                  runtime_tiles::hide_detail();
                  id(active_entity).clear();
                  id(tile_page) = 0;
                  id(show_tile_page).execute();
                }

            # Terug naar het basisscherm bij standby. Bewust via de ESPHome
            # acties en NIET met lv_obj_add_flag in een lambda: dit script
            # draait vanuit een interval, dus buiten LVGL's eigen afhandeling.
            - lvgl.widget.hide: brightness_overlay
            - lvgl.widget.hide: color_detail_overlay
            - lvgl.widget.hide: climate_detail_overlay
            - lvgl.widget.hide: climate_mode_overlay
            - lvgl.widget.hide: vacuum_overlay

  - id: publish_action
    mode: restart
    parameters:
      action: string
    then:
      - logger.log:
          level: INFO
          format: "publish_action: %s"
          args: ["action.c_str()"]
      - text_sensor.template.publish:
          id: smartdisplay_action
          state: !lambda 'return action;'
      - delay: 500ms
      - text_sensor.template.publish:
          id: smartdisplay_action
          state: ""

  - id: climate_target_preview
    parameters:
      value: int
    then:
      - lambda: |-
          id(climate_edit_ms) = millis();
          id(climate_edit_pending) = true;
          int min_x10 = id(active_climate_min_x10);
          int max_x10 = id(active_climate_max_x10);
          value = cyd::quantize_temperature(value, min_x10, max_x10,
                                            id(active_climate_step_x10));
          id(active_climate_target_x10) = value;

          char buf[16];
          snprintf(buf, sizeof(buf), "%.1f°", value / 10.0f);
          lv_label_set_text(id(climate_target_label), buf);
          lv_arc_set_value(id(climate_arc), value);

  - id: climate_target_commit
    parameters:
      value: int
    then:
      - script.execute:
          id: climate_target_preview
          value: !lambda "return value;"
      - if:
          condition:
            lambda: 'return (!runtime_tiles::enabled || runtime_tiles::fresh()) && std::string("${DIRECT_ACTIONS}") == "true";'
          then:
            - homeassistant.action:
                action: climate.set_temperature
                data:
                  entity_id: !lambda "return id(active_entity);"
                  temperature: !lambda "return id(active_climate_target_x10) / 10.0f;"

  - id: climate_adjust_target
    parameters:
      direction: int
    then:
      - lambda: |-
          int step_x10 = id(active_climate_step_x10);
          if (step_x10 < 5) step_x10 = 5;
          int next = id(active_climate_target_x10) + (direction * step_x10);
          if (next < id(active_climate_min_x10)) next = id(active_climate_min_x10);
          if (next > id(active_climate_max_x10)) next = id(active_climate_max_x10);
          id(active_climate_target_x10) = next;
      - script.execute:
          id: climate_target_commit
          value: !lambda "return id(active_climate_target_x10);"

  # Opent de moduskiezer. Verbergt modi die de entiteit niet ondersteunt en
  # markeert de huidige, zodat je ziet waar je staat voor je iets kiest.
  # Opent de stofzuigerbediening en onthoudt om welke entiteit het gaat.
  - id: open_vacuum_overlay
    mode: restart
    parameters:
      title: string
      entity: string
    then:
      - lambda: |-
          id(active_entity) = entity;
          lv_label_set_text(id(vacuum_title), title.c_str());
      - lvgl.widget.show: vacuum_overlay

  # Een losse opdracht: start, pause, stop of return_to_base.
  - id: vacuum_action
    mode: queued
    parameters:
      service: string
    then:
      - if:
          condition:
            lambda: 'return (!runtime_tiles::enabled || runtime_tiles::fresh()) && std::string("${DIRECT_ACTIONS}") == "true";'
          then:
            - homeassistant.action:
                action: !lambda "return service;"
                data:
                  entity_id: !lambda "return id(active_entity);"

  # Zuigkracht is een aparte as, los van start/stop.
  - id: vacuum_fan_speed
    mode: queued
    parameters:
      speed: string
    then:
      - if:
          condition:
            lambda: 'return (!runtime_tiles::enabled || runtime_tiles::fresh()) && std::string("${DIRECT_ACTIONS}") == "true";'
          then:
            - homeassistant.action:
                action: vacuum.set_fan_speed
                data:
                  entity_id: !lambda "return id(active_entity);"
                  fan_speed: !lambda "return speed;"

  - id: open_climate_mode_picker
    mode: restart
    then:
      - lambda: |-
          auto lower = [](std::string v) {
            for (char &c : v) { if (c >= 'A' && c <= 'Z') c = (char)(c - 'A' + 'a'); }
            return v;
          };
          std::string supported = lower(id(active_climate_supported_modes));
          std::string current = lower(id(active_climate_mode));

          auto has = [&](const char* m) {
            std::string mode(m);
            if (supported.empty() || supported == "unknown" || supported == "unavailable") return false;
            return supported.find("'" + mode + "'") != std::string::npos ||
                   supported.find("\"" + mode + "\"") != std::string::npos;
          };
          auto apply = [&](lv_obj_t* btn, const char* m) {
            if (has(m)) lv_obj_clear_flag(btn, LV_OBJ_FLAG_HIDDEN);
            else        lv_obj_add_flag(btn, LV_OBJ_FLAG_HIDDEN);
            bool selected = (current == std::string(m));
            lv_obj_set_style_bg_color(btn, lv_color_hex(selected ? 0x00A6ED : 0xFFFFFF), LV_PART_MAIN);
            lv_obj_set_style_text_color(lv_obj_get_child(btn, 0), lv_color_hex(selected ? 0xFFFFFF : 0x1B1B1B), LV_PART_MAIN);
          };
          apply(id(cmode_off), "off");
          apply(id(cmode_heat), "heat");
          apply(id(cmode_cool), "cool");
          apply(id(cmode_heat_cool), "heat_cool");
          apply(id(cmode_auto), "auto");
          apply(id(cmode_dry), "dry");
          apply(id(cmode_fan_only), "fan_only");
          // Fan and swing rows: the entity's own mode names, at most four each, as Home Assistant reports them.
          auto pretty = [](std::string raw) { if (!raw.empty() && raw[0] >= 'a' && raw[0] <= 'z') raw[0] = (char)(raw[0] - 'a' + 'A'); return raw; };
          auto fill = [&](lv_obj_t *title, lv_obj_t *chips[4], const std::string &modes, const std::string &current_mode) {
            unsigned shown = 0;
            for (unsigned i = 0; i < 4; ++i) {
              std::string raw = cyd::list_item(modes, i);
              if (raw.empty()) { lv_obj_add_flag(chips[i], LV_OBJ_FLAG_HIDDEN); continue; }
              lv_obj_clear_flag(chips[i], LV_OBJ_FLAG_HIDDEN); ++shown;
              lv_label_set_text(lv_obj_get_child(chips[i], 0), pretty(raw).c_str());
              lv_obj_set_style_bg_color(chips[i], lv_color_hex(raw == current_mode ? 0x00A6ED : 0xFFFFFF), LV_PART_MAIN);
              lv_obj_set_style_text_color(lv_obj_get_child(chips[i], 0), lv_color_hex(raw == current_mode ? 0xFFFFFF : 0x1B1B1B), LV_PART_MAIN);
            }
            if (shown) lv_obj_clear_flag(title, LV_OBJ_FLAG_HIDDEN); else lv_obj_add_flag(title, LV_OBJ_FLAG_HIDDEN);
          };
          lv_obj_t *fan_chips[4] = {id(cfan_0), id(cfan_1), id(cfan_2), id(cfan_3)};
          lv_obj_t *swing_chips[4] = {id(cswing_0), id(cswing_1), id(cswing_2), id(cswing_3)};
          fill(id(cfan_title), fan_chips, id(active_climate_fan_modes), id(active_climate_fan_mode));
          fill(id(cswing_title), swing_chips, id(active_climate_swing_modes), id(active_climate_swing_mode));
      - lvgl.widget.show: climate_mode_overlay

  # Zet precies een modus. Geen tussenstappen, dus geen ongewenste
  # commando's naar de warmtepomp onderweg.
  # Fan and swing modes from the picker: one call with the entity's own mode name.
  - id: set_climate_fan_mode
    mode: restart
    parameters:
      index: int
    then:
      - lambda: |-
          id(active_climate_fan_mode) = cyd::list_item(id(active_climate_fan_modes), index);
          id(climate_edit_ms) = millis();
          id(climate_edit_pending) = true;
      - lvgl.widget.hide: climate_mode_overlay
      - if:
          condition:
            lambda: 'return (!runtime_tiles::enabled || runtime_tiles::fresh()) && std::string("${DIRECT_ACTIONS}") == "true" && !id(active_climate_fan_mode).empty();'
          then:
            - homeassistant.action:
                action: climate.set_fan_mode
                data:
                  entity_id: !lambda "return id(active_entity);"
                  fan_mode: !lambda "return id(active_climate_fan_mode);"
  - id: set_climate_swing_mode
    mode: restart
    parameters:
      index: int
    then:
      - lambda: |-
          id(active_climate_swing_mode) = cyd::list_item(id(active_climate_swing_modes), index);
          id(climate_edit_ms) = millis();
          id(climate_edit_pending) = true;
      - lvgl.widget.hide: climate_mode_overlay
      - if:
          condition:
            lambda: 'return (!runtime_tiles::enabled || runtime_tiles::fresh()) && std::string("${DIRECT_ACTIONS}") == "true" && !id(active_climate_swing_mode).empty();'
          then:
            - homeassistant.action:
                action: climate.set_swing_mode
                data:
                  entity_id: !lambda "return id(active_entity);"
                  swing_mode: !lambda "return id(active_climate_swing_mode);"

  # Quick on/off in the climate card; climate.turn_on restores the last mode in Home Assistant.
  - id: climate_power_toggle
    mode: restart
    then:
      - lambda: |-
          std::string mode = id(active_climate_mode);
          for (char &c : mode) if (c >= 'A' && c <= 'Z') c = (char)(c - 'A' + 'a');
          id(active_climate_power_on) = mode == "off" || mode.empty() || mode == "unknown";
          id(climate_edit_ms) = millis();
          id(climate_edit_pending) = true;
          if (!id(active_climate_power_on)) { id(active_climate_mode) = "off"; lv_label_set_text(id(climate_mode_label), "Off"); }
          id(climate_power_refresh).execute();
      - if:
          condition:
            lambda: 'return (!runtime_tiles::enabled || runtime_tiles::fresh()) && std::string("${DIRECT_ACTIONS}") == "true" && id(active_climate_power_on);'
          then:
            - homeassistant.action:
                action: climate.turn_on
                data:
                  entity_id: !lambda "return id(active_entity);"
      - if:
          condition:
            lambda: 'return (!runtime_tiles::enabled || runtime_tiles::fresh()) && std::string("${DIRECT_ACTIONS}") == "true" && !id(active_climate_power_on);'
          then:
            - homeassistant.action:
                action: climate.turn_off
                data:
                  entity_id: !lambda "return id(active_entity);"

  # The power key lights up while the device runs in any mode.
  - id: climate_power_refresh
    mode: restart
    then:
      - lambda: |-
          std::string mode = id(active_climate_mode);
          for (char &c : mode) if (c >= 'A' && c <= 'Z') c = (char)(c - 'A' + 'a');
          bool on = !(mode == "off" || mode.empty() || mode == "unknown" || mode == "unavailable");
          if (id(climate_edit_pending)) on = id(active_climate_power_on);
          lv_obj_set_style_bg_color(id(climate_power_button), lv_color_hex(on ? 0xD5EEFC : 0xEEEEEE), LV_PART_MAIN);
          lv_obj_set_style_text_color(id(climate_power_icon), lv_color_hex(on ? 0x0B6E99 : 0x8A8A8A), LV_PART_MAIN);

  - id: set_climate_mode
    mode: restart
    parameters:
      mode: string
    then:
      - lambda: |-
          id(climate_edit_ms) = millis();
          id(climate_edit_pending) = true;
          id(active_climate_mode) = mode;
          id(active_climate_power_on) = mode != "off";
          id(climate_power_refresh).execute();
          lv_label_set_text(id(climate_mode_label), tile_controls::climate_mode_text(mode));
      - lvgl.widget.hide: climate_mode_overlay
      - if:
          condition:
            lambda: 'return (!runtime_tiles::enabled || runtime_tiles::fresh()) && std::string("${DIRECT_ACTIONS}") == "true";'
          then:
            - homeassistant.action:
                action: climate.set_hvac_mode
                data:
                  entity_id: !lambda "return id(active_entity);"
                  hvac_mode: !lambda "return id(active_climate_mode);"

  # Isolated 40-second preview; every light commit is suppressed in the helper.
  - id: light_controls_preview
    mode: single
    then:
      - script.execute: wake_display
      - lambda: |-
          light_controls::demo = true;
          light_controls::fallback.minimum = 2000;
          light_controls::fallback.maximum = 6500;
          light_controls::fallback.kelvin = 3000;
          light_controls::fallback.hue = 200;
          light_controls::open("diagnostic", true, true, 75);
          lv_label_set_text(id(color_detail_title), "Voorbeeld lamp");
      - lvgl.widget.hide: color_close_button
      - lvgl.widget.hide: color_done_button
      - lvgl.widget.show: color_detail_overlay
      - delay: 40s
      - lvgl.widget.hide: color_detail_overlay
      - lvgl.widget.show: color_close_button
      - lvgl.widget.show: color_done_button
      - lambda: 'light_controls::demo = false; light_controls::fallback = light_controls::State{};'

  - id: open_color_detail
    mode: restart
    then:
      - lambda: |-
          lv_label_set_text(id(color_detail_title), id(active_title).c_str());
          light_controls::open(id(active_entity), id(active_supports_color), id(active_supports_temperature), id(active_brightness_pct));
      - lvgl.widget.hide: brightness_overlay
      - lvgl.widget.show: color_detail_overlay

  - id: color_brightness_commit
    parameters:
      value: int
    then:
      - lambda: 'id(active_brightness_pct) = value;'
      - if:
          condition:
            lambda: 'return (!runtime_tiles::enabled || runtime_tiles::fresh()) && std::string("${DIRECT_ACTIONS}") == "true" && id(active_entity).rfind("light.", 0) == 0;'
          then:
            - homeassistant.action:
                action: light.turn_on
                data:
                  entity_id: !lambda "return id(active_entity);"
                  brightness_pct: !lambda "return value;"

  - id: set_light_hue
    parameters:
      value: int
    then:
      - if:
          condition:
            lambda: 'return (!runtime_tiles::enabled || runtime_tiles::fresh()) && std::string("${DIRECT_ACTIONS}") == "true" && id(active_supports_color) && id(active_entity).rfind("light.", 0) == 0;'
          then:
            - homeassistant.action:
                action: light.turn_on
                data:
                  entity_id: !lambda "return id(active_entity);"
                data_template:
                  hs_color: "{{ [hue | int, 100] }}"
                variables:
                  hue: !lambda "return light_controls::clamp(value, 0, 360);"

  - id: set_light_color_temperature
    parameters:
      kelvin: int
    then:
      - if:
          condition:
            lambda: 'return (!runtime_tiles::enabled || runtime_tiles::fresh()) && std::string("${DIRECT_ACTIONS}") == "true" && id(active_supports_temperature) && id(active_entity).rfind("light.", 0) == 0 && light_controls::active->temperature_ready();'
          then:
            - homeassistant.action:
                action: light.turn_on
                data:
                  entity_id: !lambda "return id(active_entity);"
                  color_temp_kelvin: !lambda "return light_controls::clamp(kelvin, light_controls::active->minimum, light_controls::active->maximum);"

  - id: slider_preview
    parameters:
      value: int
    then:
      - lambda: |-
          char buf[20];
          snprintf(buf, sizeof(buf), "%d%s", value, id(active_value_suffix).c_str());
          lv_label_set_text(id(overlay_value), buf);
          int pct = value;
          if (pct < 0) pct = 0;
          if (pct > 100) pct = 100;
          std::string value_text;

          if (id(active_control_kind) == "cover_position") {
            std::string closed_label = id(active_label_off).c_str();
            std::string open_label = id(active_label_on).c_str();

            if (pct <= 0) {
              value_text = closed_label;
            } else if (pct >= 100) {
              value_text = open_label;
            } else {
              char buf[40];
              snprintf(buf, sizeof(buf), "%s - %d%%", open_label.c_str(), pct);
              value_text = buf;
            }
          } else {
            if (pct <= 0) {
              value_text = id(active_label_off).c_str();
            } else {
              char buf[20];
              snprintf(buf, sizeof(buf), "%d%s", pct, id(active_value_suffix).c_str());
              value_text = buf;
            }
          }

          lv_label_set_text(id(overlay_value), value_text.c_str());


  - id: slider_commit
    parameters:
      value: int
    then:
      - if:
          condition:
            lambda: |-
              return id(active_control_kind) == "light_brightness";
          then:
            - homeassistant.action:
                action: light.turn_on
                data:
                  entity_id: !lambda "return id(active_entity);"
                  brightness_pct: !lambda "return value;"
          else:
            - if:
                condition:
                  lambda: |-
                    return id(active_control_kind) == "fan_percentage";
                then:
                  - if:
                      condition:
                        lambda: "return value <= 0;"
                      then:
                        - homeassistant.action:
                            action: fan.turn_off
                            data:
                              entity_id: !lambda "return id(active_entity);"
                      else:
                        - homeassistant.action:
                            action: fan.turn_on
                            data:
                              entity_id: !lambda "return id(active_entity);"
                        - delay: 150ms
                        - homeassistant.action:
                            action: fan.set_percentage
                            data:
                              entity_id: !lambda "return id(active_entity);"
                              percentage: !lambda "return value;"
                else:
                  - if:
                      condition:
                        lambda: |-
                          return id(active_control_kind) == "cover_position";
                      then:
                        - homeassistant.action:
                            action: cover.set_cover_position
                            data:
                              entity_id: !lambda "return id(active_entity);"
                              position: !lambda "return value;"

  # ----------------------------------------------------------
  # do_tile_action
  #
  # Centralized handler for executing Home Assistant actions
  # triggered by tile taps.
  #
  # Parameters
  # - tile_type: light | fan | switch | scene | script | cover
  # - tap_action: auto | toggle | activate | fan_toggle_preset
  # - service: optional Home Assistant service override
  # - entity_id: target entity
  # - param_key / param_val: optional parameters for custom services
  # - was_on: previous entity state (pass false for longpress actions)
  #
  # Behavior
  #
  # toggle
  #   -> toggles the entity
  #   light.toggle / fan.toggle / switch.toggle / cover.open_cover|close_cover (based on was_on)
  #
  # activate
  #   -> activates entity
  #   scene.turn_on / script.turn_on / light.turn_on / fan.turn_on / cover.open_cover
  #
  # auto
  #   -> resolves automatically based on tile_type:
  #        light/switch/fan/cover -> toggle
  #        scene/script           -> activate
  #
  # fan_toggle_preset
  #   -> if fan was ON: fan.turn_off
  #   -> if fan was OFF:
  #        fan.turn_on
  #        wait 150ms
  #        fan.set_preset_mode(param_val)
  #
  # Custom service
  #   If "service" is set, it will be called directly.
  #   param_key / param_val may be used for parameters
  #   like preset_mode, brightness_pct, percentage, etc.
  # ----------------------------------------------------------
  - id: do_tile_action
    mode: queued
    parameters:
      tile_type: string
      tap_action: string
      service: string
      entity_id: string
      param_key: string
      param_val: string
      was_on: bool
    then:
      - if:
          condition:
            lambda: |-
              if (std::string("${DIRECT_ACTIONS}") != "true") return false;
              // Debounce: zelfde entity binnen 600ms genegeerd. Voorkomt dat
              // touch-ruis dezelfde HA-actie meerdere keren afvuurt (zie
              // globals hierboven voor waarom dit nodig is).
              uint32_t now = millis();
              if (entity_id == id(last_action_entity) && (now - id(last_action_ms)) < 600) {
                ESP_LOGD("tile", "do_tile_action: debounced repeat for %s (%ums na vorige)",
                         entity_id.c_str(), now - id(last_action_ms));
                return false;
              }
              id(last_action_entity) = entity_id;
              id(last_action_ms) = now;
              return true;
          then:
            - lambda: |-
                ESP_LOGD("tile", "do_tile_action type=%s action=%s service=%s entity=%s key=%s val=%s was_on=%d",
                         tile_type.c_str(), tap_action.c_str(), service.c_str(), entity_id.c_str(),
                         param_key.c_str(), param_val.c_str(), (int)was_on);

            - if:
                condition:
                  lambda: |-
                    return tap_action == "fan_toggle_preset";
                then:
                  - if:
                      condition:
                        lambda: |-
                          return was_on;
                      then:
                        - homeassistant.action:
                            action: fan.turn_off
                            data:
                              entity_id: !lambda 'return entity_id;'
                      else:
                        - homeassistant.action:
                            action: fan.turn_on
                            data:
                              entity_id: !lambda 'return entity_id;'
                        - delay: 150ms
                        - homeassistant.action:
                            action: fan.set_preset_mode
                            data:
                              entity_id: !lambda 'return entity_id;'
                              preset_mode: !lambda 'return param_val;'

                else:
                  - if:
                      condition:
                        lambda: |-
                          std::string resolved = tap_action;
                          if (resolved == "auto") {
                            if (tile_type == "scene" || tile_type == "script") resolved = "activate";
                            else resolved = "toggle";
                          }
                          return resolved == "toggle";
                      then:
                        - if:
                            condition:
                              lambda: |-
                                return service.size() > 0;
                            then:
                              - homeassistant.action:
                                  action: !lambda 'return service;'
                                  data:
                                    entity_id: !lambda 'return entity_id;'
                            else:
                              - if:
                                  condition:
                                    lambda: |-
                                      return tile_type == "light";
                                  then:
                                    - homeassistant.action:
                                        action: light.toggle
                                        data:
                                          entity_id: !lambda 'return entity_id;'
                                  else:
                                    - if:
                                        condition:
                                          lambda: |-
                                            return tile_type == "fan";
                                        then:
                                          - homeassistant.action:
                                              action: fan.toggle
                                              data:
                                                entity_id: !lambda 'return entity_id;'
                                        else:
                                          - if:
                                              condition:
                                                lambda: |-
                                                  return tile_type == "switch";
                                              then:
                                                - homeassistant.action:
                                                    action: switch.toggle
                                                    data:
                                                      entity_id: !lambda 'return entity_id;'
                                              else:
                                                - if:
                                                    condition:
                                                      lambda: |-
                                                        return tile_type == "cover";
                                                    then:
                                                      - homeassistant.action:
                                                          action: cover.set_cover_position
                                                          data:
                                                            entity_id: !lambda 'return entity_id;'
                                                            position: !lambda |-
                                                              return was_on ? 0 : 100;

                      else:
                        - if:
                            condition:
                              lambda: |-
                                std::string resolved = tap_action;
                                if (resolved == "auto") {
                                  if (tile_type == "scene" || tile_type == "script") resolved = "activate";
                                  else resolved = "toggle";
                                }
                                return resolved == "activate";
                            then:
                              - if:
                                  condition:
                                    lambda: |-
                                      return service.size() > 0;
                                  then:
                                    - if:
                                        condition:
                                          lambda: |-
                                            return param_key == "preset_mode";
                                        then:
                                          - homeassistant.action:
                                              action: !lambda 'return service;'
                                              data:
                                                entity_id: !lambda 'return entity_id;'
                                                preset_mode: !lambda 'return param_val;'
                                        else:
                                          - if:
                                              condition:
                                                lambda: |-
                                                  return param_key == "brightness_pct";
                                              then:
                                                - homeassistant.action:
                                                    action: !lambda 'return service;'
                                                    data:
                                                      entity_id: !lambda 'return entity_id;'
                                                      brightness_pct: !lambda 'return atoi(param_val.c_str());'
                                              else:
                                                - if:
                                                    condition:
                                                      lambda: |-
                                                        return param_key == "percentage";
                                                    then:
                                                      - homeassistant.action:
                                                          action: !lambda 'return service;'
                                                          data:
                                                            entity_id: !lambda 'return entity_id;'
                                                            percentage: !lambda 'return atoi(param_val.c_str());'
                                                    else:
                                                      - if:
                                                          condition:
                                                            lambda: |-
                                                              return param_key == "option";
                                                          then:
                                                            - homeassistant.action:
                                                                action: !lambda 'return service;'
                                                                data:
                                                                  entity_id: !lambda 'return entity_id;'
                                                                  option: !lambda 'return param_val;'
                                                          else:
                                                            - homeassistant.action:
                                                                action: !lambda 'return service;'
                                                                data:
                                                                  entity_id: !lambda 'return entity_id;'
                                  else:
                                    - if:
                                        condition:
                                          lambda: |-
                                            return tile_type == "scene";
                                        then:
                                          - homeassistant.action:
                                              action: scene.turn_on
                                              data:
                                                entity_id: !lambda 'return entity_id;'
                                        else:
                                          - if:
                                              condition:
                                                lambda: |-
                                                  return tile_type == "script";
                                              then:
                                                - homeassistant.action:
                                                    action: script.turn_on
                                                    data:
                                                      entity_id: !lambda 'return entity_id;'
                                              else:
                                                - if:
                                                    condition:
                                                      lambda: |-
                                                        return tile_type == "light";
                                                    then:
                                                      - homeassistant.action:
                                                          action: light.turn_on
                                                          data:
                                                            entity_id: !lambda 'return entity_id;'
                                                    else:
                                                      - if:
                                                          condition:
                                                            lambda: |-
                                                              return tile_type == "fan";
                                                          then:
                                                            - homeassistant.action:
                                                                action: fan.turn_on
                                                                data:
                                                                  entity_id: !lambda 'return entity_id;'
                                                          else:
                                                            - if:
                                                                condition:
                                                                  lambda: |-
                                                                    return tile_type == "switch";
                                                                then:
                                                                  - homeassistant.action:
                                                                      action: switch.turn_on
                                                                      data:
                                                                        entity_id: !lambda 'return entity_id;'
                                                                else:
                                                                  - if:
                                                                      condition:
                                                                        lambda: |-
                                                                          return tile_type == "cover";
                                                                      then:
                                                                        - homeassistant.action:
                                                                            action: cover.open_cover
                                                                            data:
                                                                              entity_id: !lambda 'return entity_id;'

  - id: open_value_overlay
    parameters:
      title: string
      entity: string
      tile_type: string
      longpress_mode: string
      was_on: bool
      off_value: int
      brightness_value: float
      percentage_value: float
      position_value: float
      icon_text: string
      slider_bg_color: uint32_t
      slider_fill_color: uint32_t
      slider_icon_color: uint32_t
      label_off: string
      label_on: string
      supported_color_modes: string
      climate_current_temperature: float
      climate_target_temperature: float
      climate_humidity: float
      climate_mode: string
      climate_supported_modes: string
      climate_min_temp: string
      climate_max_temp: string
      climate_step: string
    then:
      - lambda: |-
          // Accentkleur uit het Home Assistant-domein: het stuk voor de punt in
          // het entity_id. script/scene/button vuur je af (ACCENT_ACTION), een
          // light is een light (ACCENT_LIGHT), de rest is apparaat.
          // LET OP: deze helper staat twee keer in dit bestand — hier en in
          // open_value_overlay. Pas ze samen aan.
          auto accent_for = [](const std::string& entity_id) -> uint32_t {
            std::string d = entity_id.substr(0, entity_id.find('.'));
            if (d == "script" || d == "scene" || d == "button" ||
                d == "input_button" || d == "automation") return ${ACCENT_ACTION};
            if (d == "light") return ${ACCENT_LIGHT};
            return ${ACCENT_DEVICE};
          };

          // De sliderkleur komt van de tegel, dus die kan ook ${ACCENT_AUTO} zijn.
          uint32_t fill_color = (slider_fill_color == ${ACCENT_AUTO})
                                  ? accent_for(entity) : slider_fill_color;

          std::string mode = longpress_mode;
          auto contains_mode = [](const std::string& modes, const std::string& needle) {
            return modes.find(needle) != std::string::npos;
          };
          if (mode == "auto") {
            if (tile_type == "light") mode = "brightness";
            else if (tile_type == "fan") mode = "percentage";
            else if (tile_type == "cover") mode = "cover_position";
            else if (tile_type == "climate") mode = "climate_temperature";
            else mode = "none";
          }

          if (mode == "none") return;

          id(active_entity) = entity;
          id(active_value_suffix) = " %";
          id(active_label_off) = label_off;
          id(active_label_on) = label_on;
          id(active_title) = title;
          id(active_icon_text) = icon_text;
          id(active_supports_color) = false;
          id(active_supports_temperature) = false;
          lv_obj_add_flag(id(overlay_color_button), LV_OBJ_FLAG_HIDDEN);

          if (mode == "climate_temperature") {
            auto to_x10 = [](float value, int fallback) -> int {
              if (isnan(value)) return fallback;
              return (int) lround(value * 10.0f);
            };
            auto parse_x10 = [](const std::string& value, int fallback) -> int {
              if (value.empty()) return fallback;
              return (int) lround(atof(value.c_str()) * 10.0f);
            };
            id(climate_edit_pending) = false;
            id(active_control_kind) = "climate_temperature";
            id(active_climate_min_x10) = parse_x10(climate_min_temp, 50);
            id(active_climate_max_x10) = parse_x10(climate_max_temp, 300);
            id(active_climate_step_x10) = parse_x10(climate_step, 5);
            if (id(active_climate_step_x10) < 5) id(active_climate_step_x10) = 5;
            if (id(active_climate_max_x10) <= id(active_climate_min_x10)) {
              id(active_climate_min_x10) = 50;
              id(active_climate_max_x10) = 300;
            }

            id(active_climate_current_x10) = to_x10(climate_current_temperature, 0);
            int fallback_target = isnan(climate_current_temperature) ? 200 : id(active_climate_current_x10);
            id(active_climate_target_x10) = to_x10(climate_target_temperature, fallback_target);
            if (id(active_climate_target_x10) < id(active_climate_min_x10)) id(active_climate_target_x10) = id(active_climate_min_x10);
            if (id(active_climate_target_x10) > id(active_climate_max_x10)) id(active_climate_target_x10) = id(active_climate_max_x10);
            id(active_climate_target_x10) = id(active_climate_min_x10) + (int) lround((id(active_climate_target_x10) - id(active_climate_min_x10)) / (float) id(active_climate_step_x10)) * id(active_climate_step_x10);
            if (id(active_climate_target_x10) < id(active_climate_min_x10)) id(active_climate_target_x10) = id(active_climate_min_x10);
            if (id(active_climate_target_x10) > id(active_climate_max_x10)) id(active_climate_target_x10) = id(active_climate_max_x10);
            id(active_climate_humidity) = isnan(climate_humidity) ? -1 : (int) lround(climate_humidity);
            id(active_climate_mode) = climate_mode.empty() ? std::string("Auto") : climate_mode;
            id(active_climate_supported_modes) = climate_supported_modes;

            lv_label_set_text(id(climate_detail_title), title.c_str());

            char current_buf[48];
            if (isnan(climate_current_temperature)) {
              snprintf(current_buf, sizeof(current_buf), "Nu: --");
            } else if (id(active_climate_humidity) >= 0) {
              snprintf(current_buf, sizeof(current_buf), "Nu: %.1f° · %d%%", climate_current_temperature, id(active_climate_humidity));
            } else {
              snprintf(current_buf, sizeof(current_buf), "Nu: %.1f°", climate_current_temperature);
            }
            lv_label_set_text(id(climate_current_label), current_buf);

            char target_buf[16];
            snprintf(target_buf, sizeof(target_buf), "%.1f°", id(active_climate_target_x10) / 10.0f);
            lv_label_set_text(id(climate_target_label), target_buf);
            lv_label_set_text(id(climate_mode_label), tile_controls::climate_mode_text(id(active_climate_mode)));
            id(climate_power_refresh).execute();

            lv_arc_set_range(id(climate_arc), id(active_climate_min_x10), id(active_climate_max_x10));
            lv_arc_set_value(id(climate_arc), id(active_climate_target_x10));

            if (atoi("${DISPLAY_W}") < atoi("${DISPLAY_H}")) {
              lv_obj_set_size(id(climate_arc), 294, 294);
              lv_obj_set_y(id(climate_arc), 16);
              lv_obj_set_y(id(climate_current_label), 96);
              lv_obj_set_y(id(climate_minus_button), -124);
              lv_obj_set_y(id(climate_plus_button), -124);
              lv_obj_set_y(id(climate_mode_pill), -36);
            } else {
              lv_obj_set_size(id(climate_arc), 264, 264);
              lv_obj_set_y(id(climate_arc), 36);
              lv_obj_set_y(id(climate_current_label), 80);
              lv_obj_set_y(id(climate_minus_button), -28);
              lv_obj_set_y(id(climate_plus_button), -28);
              lv_obj_set_y(id(climate_mode_pill), -30);
            }

            lv_obj_add_flag(id(brightness_overlay), LV_OBJ_FLAG_HIDDEN);
            lv_obj_clear_flag(id(climate_detail_overlay), LV_OBJ_FLAG_HIDDEN);
            return;
          }

          int pct = off_value;

          if (mode == "brightness") {
            id(active_control_kind) = "light_brightness";
            if (was_on) {
              if (isnan(brightness_value)) pct = 100;
              else pct = (int) lround((brightness_value / 255.0f) * 100.0f);
            }
          } else if (mode == "percentage") {
            id(active_control_kind) = "fan_percentage";
            if (was_on) {
              if (isnan(percentage_value)) pct = 0;
              else pct = (int) lround(percentage_value);
            }
          } else if (mode == "cover_position") {
            id(active_control_kind) = "cover_position";
            if (isnan(position_value)) pct = was_on ? 100 : 0;
            else pct = (int) lround(position_value);
          } else {
            return;
          }

          if (pct < 0) pct = 0;
          if (pct > 100) pct = 100;
          id(active_brightness_pct) = pct;

          if (tile_type == "light" && std::string("${DIRECT_ACTIONS}") == "true") {
            id(active_supports_color) =
              contains_mode(supported_color_modes, "hs") ||
              contains_mode(supported_color_modes, "rgb") ||
              contains_mode(supported_color_modes, "rgbw") ||
              contains_mode(supported_color_modes, "rgbww") ||
              contains_mode(supported_color_modes, "xy");
            id(active_supports_temperature) = contains_mode(supported_color_modes, "color_temp");

            if (id(active_supports_color) || id(active_supports_temperature)) {
              lv_obj_clear_flag(id(overlay_color_button), LV_OBJ_FLAG_HIDDEN);
            }
          }

          if (tile_type == "cover") {
            lv_obj_set_style_bg_color(id(overlay_slider), lv_color_hex(fill_color), LV_PART_MAIN);
            lv_obj_set_style_bg_color(id(overlay_slider), lv_color_hex(slider_bg_color), LV_PART_INDICATOR);
            lv_obj_set_style_bg_opa(id(overlay_slider), LV_OPA_COVER, LV_PART_MAIN);
          }
          else{
            lv_obj_set_style_bg_color(id(overlay_slider), lv_color_hex(slider_bg_color), LV_PART_MAIN);
            lv_obj_set_style_bg_color(id(overlay_slider), lv_color_hex(fill_color), LV_PART_INDICATOR);
            lv_obj_set_style_bg_opa(id(overlay_slider), LV_OPA_COVER, LV_PART_MAIN);
          }
          lv_obj_set_style_radius(id(overlay_slider), 28, LV_PART_MAIN);
          lv_obj_set_style_radius(id(overlay_slider), 0, LV_PART_INDICATOR);

          lv_label_set_text(id(overlay_title), title.c_str());
          lv_label_set_text(id(overlay_icon), icon_text.c_str());
          lv_slider_set_value(id(overlay_slider), pct, LV_ANIM_OFF);

          std::string value_text;

          if (tile_type == "cover") {
            if (pct <= 0) {
              value_text = label_off;
            } else if (pct >= 100) {
              value_text = label_on;
            } else {
              char buf[40];
              snprintf(buf, sizeof(buf), "%s - %d%%", label_on.c_str(), pct);
              value_text = buf;
            }
          } else {
            if (pct <= 0) {
              value_text = label_off;
            } else {
              char buf[20];
              snprintf(buf, sizeof(buf), "%d%s", pct, id(active_value_suffix).c_str());
              value_text = buf;
            }
          }

          lv_label_set_text(id(overlay_value), value_text.c_str());

          lv_obj_set_style_bg_opa(id(overlay_slider), LV_OPA_COVER, LV_PART_INDICATOR);

          lv_obj_set_style_text_color(id(overlay_icon), lv_color_hex(slider_icon_color), 0);

      - if:
          condition:
            lambda: 'return id(active_control_kind) != "climate_temperature";'
          then:
            - if:
                condition:
                  lambda: 'return id(active_supports_color) || id(active_supports_temperature);'
                then:
                  - script.execute: open_color_detail
                else:
                  - lvgl.widget.show: brightness_overlay

  # UI refresh (values + time + styles) + render
  - id: ui_refresh
    mode: single
    then:
      - delay: 100ms
      - lambda: |-
          if (runtime_tiles::enabled) {
            runtime_tiles::render(id(lbl_room));
            auto now = id(homeassistant_time).now();
            if (screen_settings::current.show_clock) lv_obj_clear_flag(id(lbl_time), LV_OBJ_FLAG_HIDDEN);
            else lv_obj_add_flag(id(lbl_time), LV_OBJ_FLAG_HIDDEN);
            if (now.is_valid()) runtime_tiles::label(id(lbl_time), now.strftime(screen_settings::current.clock_24h ? "%H:%M" : "%I:%M"));
            return;
          }
          auto set_lbl = [](lv_obj_t* lbl, const std::string& s) {
            if (lbl && s != lv_label_get_text(lbl)) lv_label_set_text(lbl, s.c_str());
          };

          auto set_value_auto = [&](lv_obj_t* lbl,
                                    bool on,
                                    const std::string& tile_type,
                                    const std::string& value_mode,
                                    float brightness,
                                    float percentage,
                                    const std::string& preset,
                                    float climate_current_temperature,
                                    float climate_target_temperature,
                                    float climate_humidity,
                                    const std::string& label_on,
                                    const std::string& label_off) {
            std::string mode = value_mode;

            if (mode == "auto" || mode.empty()) {
              if (tile_type == "light") {
                mode = "brightness";
              } else if (tile_type == "fan") {
                mode = preset.empty() ? "percentage" : "preset";
              } else if (tile_type == "climate") {
                mode = "climate";
              } else {
                mode = "text";
              }
            }

            if (mode == "brightness") {
              if (!on) {
                set_lbl(lbl, label_off);
                return;
              }
              if (isnan(brightness)) {
                set_lbl(lbl, "100 %");
                return;
              }
              int pct = (int) lround((brightness / 255.0f) * 100.0f);
              char buf[8];
              snprintf(buf, sizeof(buf), "%d %%", pct);
              set_lbl(lbl, std::string(buf));
              return;
            }

            if (mode == "percentage") {
              if (!on) {
                set_lbl(lbl, label_off);
                return;
              }
              int pct = isnan(percentage) ? 0 : (int) lround(percentage);
              char buf[8];
              snprintf(buf, sizeof(buf), "%d %%", pct);
              set_lbl(lbl, std::string(buf));
              return;
            }

            if (mode == "preset") {
              if (!on) {
                set_lbl(lbl, label_off);
                return;
              }
              if (!preset.empty()) {
                set_lbl(lbl, preset);
              } else {
                set_lbl(lbl, label_on);
              }
              return;
            }

            if (mode == "climate") {
              if (!on) {
                set_lbl(lbl, label_off);
                return;
              }

              float temp = isnan(climate_target_temperature) ? climate_current_temperature : climate_target_temperature;
              if (isnan(temp)) {
                set_lbl(lbl, label_on);
                return;
              }

              char buf[16];
              snprintf(buf, sizeof(buf), "%.1f °", temp);
              set_lbl(lbl, std::string(buf));
              return;
            }

            if (mode == "text") {
              if (tile_type == "scene" || tile_type == "script") {
                set_lbl(lbl, label_on);
              } else {
                set_lbl(lbl, on ? label_on : label_off);
              }
              return;
            }

            set_lbl(lbl, "—");
          };

          // active_state niet leeg? Dan telt alleen die exacte HA-state als "aan".
          // Zo kan een input_select ("Vol"/"Leeg") ook een tegel laten oplichten.
          auto is_active = [](const std::string& tile_type, const std::string& state,
                              const std::string& active_state = std::string()) {
            if (!active_state.empty()) return state == active_state;
            if (tile_type == "climate") {
              return !state.empty() && state != "off" && state != "unavailable" && state != "unknown";
            }
            if (tile_type == "vacuum") return state == "cleaning" || state == "returning";
            if (tile_type == "scene" || tile_type == "script") return true;
            return state == "on";
          };

          // Cover-aware active state: "closed" = off, anything else (open/opening/closing) = on
          bool t1_on = (std::string("${TILE1_TYPE}") == "cover") ? (id(tile1_cover_state).state != "closed") : is_active("${TILE1_TYPE}", std::string(id(ha_state_tile1).state.c_str()), "${TILE1_ACTIVE_STATE}");
          bool t2_on = (std::string("${TILE2_TYPE}") == "cover") ? (id(tile2_cover_state).state != "closed") : is_active("${TILE2_TYPE}", std::string(id(ha_state_tile2).state.c_str()), "${TILE2_ACTIVE_STATE}");
          bool t3_on = (std::string("${TILE3_TYPE}") == "cover") ? (id(tile3_cover_state).state != "closed") : is_active("${TILE3_TYPE}", std::string(id(ha_state_tile3).state.c_str()), "${TILE3_ACTIVE_STATE}");
          bool t4_on = (std::string("${TILE4_TYPE}") == "cover") ? (id(tile4_cover_state).state != "closed") : is_active("${TILE4_TYPE}", std::string(id(ha_state_tile4).state.c_str()), "${TILE4_ACTIVE_STATE}");
          bool t5_on = (std::string("${TILE5_TYPE}") == "cover") ? (id(tile5_cover_state).state != "closed") : is_active("${TILE5_TYPE}", std::string(id(ha_state_tile5).state.c_str()), "${TILE5_ACTIVE_STATE}");
          bool t6_on = (std::string("${TILE6_TYPE}") == "cover") ? (id(tile6_cover_state).state != "closed") : is_active("${TILE6_TYPE}", std::string(id(ha_state_tile6).state.c_str()), "${TILE6_ACTIVE_STATE}");
          // Tegel 7/8 hebben geen cover_state-sensor, dus geen cover-tak nodig.
          bool t7_on = is_active("${TILE7_TYPE}", std::string(id(ha_state_tile7).state.c_str()), "${TILE7_ACTIVE_STATE}");
          bool t8_on = is_active("${TILE8_TYPE}", std::string(id(ha_state_tile8).state.c_str()), "${TILE8_ACTIVE_STATE}");
          bool t9_on = is_active("${TILE9_TYPE}", std::string(id(ha_state_tile9).state.c_str()), "${TILE9_ACTIVE_STATE}");
          bool t10_on = is_active("${TILE10_TYPE}", std::string(id(ha_state_tile10).state.c_str()), "${TILE10_ACTIVE_STATE}");

          set_value_auto(id(t1_value), t1_on, "${TILE1_TYPE}", "${TILE1_VALUE_MODE}",
                         id(tile1_brightness).state, id(tile1_percentage).state, std::string(id(tile1_preset).state.c_str()),
                         id(tile1_climate_current_temperature).state, id(tile1_climate_target_temperature).state, id(tile1_climate_humidity).state,
                         "${TILE1_LABEL_ON}", "${TILE1_LABEL_OFF}");

          set_value_auto(id(t2_value), t2_on, "${TILE2_TYPE}", "${TILE2_VALUE_MODE}",
                         id(tile2_brightness).state, id(tile2_percentage).state, std::string(id(tile2_preset).state.c_str()),
                         id(tile2_climate_current_temperature).state, id(tile2_climate_target_temperature).state, id(tile2_climate_humidity).state,
                         "${TILE2_LABEL_ON}", "${TILE2_LABEL_OFF}");

          set_value_auto(id(t3_value), t3_on, "${TILE3_TYPE}", "${TILE3_VALUE_MODE}",
                         id(tile3_brightness).state, id(tile3_percentage).state, std::string(id(tile3_preset).state.c_str()),
                         id(tile3_climate_current_temperature).state, id(tile3_climate_target_temperature).state, id(tile3_climate_humidity).state,
                         "${TILE3_LABEL_ON}", "${TILE3_LABEL_OFF}");

          set_value_auto(id(t4_value), t4_on, "${TILE4_TYPE}", "${TILE4_VALUE_MODE}",
                         id(tile4_brightness).state, id(tile4_percentage).state, std::string(id(tile4_preset).state.c_str()),
                         id(tile4_climate_current_temperature).state, id(tile4_climate_target_temperature).state, id(tile4_climate_humidity).state,
                         "${TILE4_LABEL_ON}", "${TILE4_LABEL_OFF}");

          set_value_auto(id(t5_value), t5_on, "${TILE5_TYPE}", "${TILE5_VALUE_MODE}",
                         id(tile5_brightness).state, id(tile5_percentage).state, std::string(id(tile5_preset).state.c_str()),
                         id(tile5_climate_current_temperature).state, id(tile5_climate_target_temperature).state, id(tile5_climate_humidity).state,
                         "${TILE5_LABEL_ON}", "${TILE5_LABEL_OFF}");

          set_value_auto(id(t6_value), t6_on, "${TILE6_TYPE}", "${TILE6_VALUE_MODE}",
                         id(tile6_brightness).state, id(tile6_percentage).state, std::string(id(tile6_preset).state.c_str()),
                         id(tile6_climate_current_temperature).state, id(tile6_climate_target_temperature).state, id(tile6_climate_humidity).state,
                         "${TILE6_LABEL_ON}", "${TILE6_LABEL_OFF}");

          // Tegel 7: light met alleen brightness. Tegel 8: puur tekst (Vol/Leeg).
          set_value_auto(id(t7_value), t7_on, "${TILE7_TYPE}", "${TILE7_VALUE_MODE}",
                         id(tile7_brightness).state, NAN, std::string(),
                         NAN, NAN, NAN,
                         "${TILE7_LABEL_ON}", "${TILE7_LABEL_OFF}");

          set_value_auto(id(t8_value), t8_on, "${TILE8_TYPE}", "${TILE8_VALUE_MODE}",
                         NAN, NAN, std::string(),
                         NAN, NAN, NAN,
                         "${TILE8_LABEL_ON}", "${TILE8_LABEL_OFF}");

          // Tegel 9: kleurenlamp (brightness). Tegel 10: puur tekst (Aan/Uit).
          set_value_auto(id(t9_value), t9_on, "${TILE9_TYPE}", "${TILE9_VALUE_MODE}",
                         id(tile9_brightness).state, NAN, std::string(),
                         NAN, NAN, NAN,
                         "${TILE9_LABEL_ON}", "${TILE9_LABEL_OFF}");

          set_value_auto(id(t10_value), t10_on, "${TILE10_TYPE}", "${TILE10_VALUE_MODE}",
                         NAN, NAN, std::string(),
                         NAN, NAN, NAN,
                         "${TILE10_LABEL_ON}", "${TILE10_LABEL_OFF}");

          // Missing state is not an off state. Preserve meaningful vacuum states.
          const char* vacuum_state = id(ha_state_tile6).state.c_str();
          if (std::string("${TILE6_TYPE}") == "vacuum") {
            std::string state(vacuum_state);
            if (state == "cleaning") set_lbl(id(t6_value), "Bezig");
            else if (state == "docked") set_lbl(id(t6_value), "In dock");
            else if (state == "returning") set_lbl(id(t6_value), "Naar dock");
            else if (state == "paused") set_lbl(id(t6_value), "Gepauzeerd");
            else if (state == "error") set_lbl(id(t6_value), "Fout");
            else if (!state.empty()) set_lbl(id(t6_value), state);
          }
          if (!id(ha_state_tile1).has_state() || id(ha_state_tile1).state == "unknown" || id(ha_state_tile1).state == "unavailable")
            set_lbl(id(t1_value), "Niet beschikbaar");
          if (!id(ha_state_tile2).has_state() || id(ha_state_tile2).state == "unknown" || id(ha_state_tile2).state == "unavailable")
            set_lbl(id(t2_value), "Niet beschikbaar");
          if (!id(ha_state_tile3).has_state() || id(ha_state_tile3).state == "unknown" || id(ha_state_tile3).state == "unavailable")
            set_lbl(id(t3_value), "Niet beschikbaar");
          if (!id(ha_state_tile4).has_state() || id(ha_state_tile4).state == "unknown" || id(ha_state_tile4).state == "unavailable")
            set_lbl(id(t4_value), "Niet beschikbaar");
          if (!id(ha_state_tile5).has_state() || id(ha_state_tile5).state == "unknown" || id(ha_state_tile5).state == "unavailable")
            set_lbl(id(t5_value), "Niet beschikbaar");
          if (!id(ha_state_tile6).has_state() || id(ha_state_tile6).state == "unknown" || id(ha_state_tile6).state == "unavailable")
            set_lbl(id(t6_value), "Niet beschikbaar");
          if (!id(ha_state_tile7).has_state() || id(ha_state_tile7).state == "unknown" || id(ha_state_tile7).state == "unavailable")
            set_lbl(id(t7_value), "Niet beschikbaar");
          if (!id(ha_state_tile8).has_state() || id(ha_state_tile8).state == "unknown" || id(ha_state_tile8).state == "unavailable")
            set_lbl(id(t8_value), "Niet beschikbaar");
          if (!id(ha_state_tile9).has_state() || id(ha_state_tile9).state == "unknown" || id(ha_state_tile9).state == "unavailable")
            set_lbl(id(t9_value), "Niet beschikbaar");
          if (!id(ha_state_tile10).has_state() || id(ha_state_tile10).state == "unknown" || id(ha_state_tile10).state == "unavailable")
            set_lbl(id(t10_value), "Niet beschikbaar");
          if (id(active_control_kind) == "climate_temperature" && !lv_obj_has_flag(id(climate_detail_overlay), LV_OBJ_FLAG_HIDDEN)) {
            auto label_for_climate_mode = [](std::string mode) {
              for (char &c : mode) {
                if (c >= 'A' && c <= 'Z') c = (char) (c - 'A' + 'a');
              }
              if (mode == "off") return std::string("Off");
              if (mode == "heat") return std::string("Heat");
              if (mode == "cool") return std::string("Cool");
              if (mode == "heat_cool") return std::string("Heat/Cool");
              if (mode == "auto") return std::string("Auto");
              if (mode == "dry") return std::string("Dry");
              if (mode == "fan_only") return std::string("Fan");
              return mode.empty() ? std::string("Auto") : mode;
            };
            auto sync_open_climate = [&](const std::string& entity,
                                         float current_temperature,
                                         float target_temperature,
                                         float humidity,
                                         const std::string& climate_mode) {
              if (id(active_entity) != entity) return;
              auto to_x10 = [](float value, int fallback) -> int {
                if (isnan(value)) return fallback;
                return (int) lround(value * 10.0f);
              };

              id(active_climate_current_x10) = to_x10(current_temperature, id(active_climate_current_x10));
              id(active_climate_humidity) = isnan(humidity) ? -1 : (int) lround(humidity);
              if (!climate_mode.empty() && !id(touch_down) &&
                  !(id(climate_edit_pending) && millis() - id(climate_edit_ms) < 3000)) {
                id(active_climate_mode) = climate_mode;
                lv_label_set_text(id(climate_mode_label), label_for_climate_mode(climate_mode).c_str());
              }

              const bool editing = id(touch_down) ||
                  (id(climate_edit_pending) && millis() - id(climate_edit_ms) < 3000);
              if (!editing) id(climate_edit_pending) = false;
              int target_x10 = editing ? id(active_climate_target_x10) :
                  to_x10(target_temperature, id(active_climate_target_x10));
              if (target_x10 < id(active_climate_min_x10)) target_x10 = id(active_climate_min_x10);
              if (target_x10 > id(active_climate_max_x10)) target_x10 = id(active_climate_max_x10);
              int step_x10 = id(active_climate_step_x10);
              if (step_x10 < 5) step_x10 = 5;
              target_x10 = id(active_climate_min_x10) + (int) lround((target_x10 - id(active_climate_min_x10)) / (float) step_x10) * step_x10;
              if (target_x10 < id(active_climate_min_x10)) target_x10 = id(active_climate_min_x10);
              if (target_x10 > id(active_climate_max_x10)) target_x10 = id(active_climate_max_x10);
              id(active_climate_target_x10) = target_x10;

              char current_buf[48];
              if (isnan(current_temperature)) {
                snprintf(current_buf, sizeof(current_buf), "Nu: --");
              } else if (id(active_climate_humidity) >= 0) {
                snprintf(current_buf, sizeof(current_buf), "Nu: %.1f° · %d%%", current_temperature, id(active_climate_humidity));
              } else {
                snprintf(current_buf, sizeof(current_buf), "Nu: %.1f°", current_temperature);
              }
              lv_label_set_text(id(climate_current_label), current_buf);

              char target_buf[16];
              snprintf(target_buf, sizeof(target_buf), "%.1f°", id(active_climate_target_x10) / 10.0f);
              lv_label_set_text(id(climate_target_label), target_buf);
              lv_arc_set_value(id(climate_arc), id(active_climate_target_x10));
            };

            if (std::string("${TILE1_TYPE}") == "climate") sync_open_climate("${TILE1_ENTITY}", id(tile1_climate_current_temperature).state, id(tile1_climate_target_temperature).state, id(tile1_climate_humidity).state, std::string(id(tile1_climate_mode).state.c_str()));
            if (std::string("${TILE2_TYPE}") == "climate") sync_open_climate("${TILE2_ENTITY}", id(tile2_climate_current_temperature).state, id(tile2_climate_target_temperature).state, id(tile2_climate_humidity).state, std::string(id(tile2_climate_mode).state.c_str()));
            if (std::string("${TILE3_TYPE}") == "climate") sync_open_climate("${TILE3_ENTITY}", id(tile3_climate_current_temperature).state, id(tile3_climate_target_temperature).state, id(tile3_climate_humidity).state, std::string(id(tile3_climate_mode).state.c_str()));
            if (std::string("${TILE4_TYPE}") == "climate") sync_open_climate("${TILE4_ENTITY}", id(tile4_climate_current_temperature).state, id(tile4_climate_target_temperature).state, id(tile4_climate_humidity).state, std::string(id(tile4_climate_mode).state.c_str()));
            if (std::string("${TILE5_TYPE}") == "climate") sync_open_climate("${TILE5_ENTITY}", id(tile5_climate_current_temperature).state, id(tile5_climate_target_temperature).state, id(tile5_climate_humidity).state, std::string(id(tile5_climate_mode).state.c_str()));
            if (std::string("${TILE6_TYPE}") == "climate") sync_open_climate("${TILE6_ENTITY}", id(tile6_climate_current_temperature).state, id(tile6_climate_target_temperature).state, id(tile6_climate_humidity).state, std::string(id(tile6_climate_mode).state.c_str()));
          }

          {
            auto now = id(homeassistant_time).now();
            // Vóór de eerste tijd-sync is now() epoch 0 (1970) — dan geen
            // misleidende "01:00" tonen, gewoon leeg laten tot er een
            // echte tijd binnen is (na de eerste Home Assistant-tijdsynchronisatie).
            if (now.is_valid()) {
              char buf[10];

              if (std::string("${TIME_24H}") == "true") {
                snprintf(buf, sizeof(buf), "%02d:%02d", now.hour, now.minute);
              } else {
                int hour12 = now.hour % 12;
                if (hour12 == 0) hour12 = 12;
                snprintf(buf, sizeof(buf), "%d:%02d %s", hour12, now.minute, now.hour >= 12 ? "PM" : "AM");
              }

              set_lbl(id(lbl_time), std::string(buf));
            }
          }

          // Accentkleur uit het Home Assistant-domein: het stuk voor de punt in
          // het entity_id. script/scene/button vuur je af (ACCENT_ACTION), een
          // light is een light (ACCENT_LIGHT), de rest is apparaat.
          // LET OP: deze helper staat twee keer in dit bestand — hier en in
          // open_value_overlay. Pas ze samen aan.
          auto accent_for = [](const std::string& entity_id) -> uint32_t {
            std::string d = entity_id.substr(0, entity_id.find('.'));
            if (d == "script" || d == "scene" || d == "button" ||
                d == "input_button" || d == "automation") return ${ACCENT_ACTION};
            if (d == "light") return ${ACCENT_LIGHT};
            return ${ACCENT_DEVICE};
          };

          auto apply_tile = [&](bool active,
                                const std::string& entity_id,
                                lv_obj_t* tile,
                                lv_obj_t* circle,
                                lv_obj_t* title,
                                lv_obj_t* value,
                                lv_obj_t* icon_lbl,
                                uint32_t circle_active,
                                uint32_t circle_disabled,
                                uint32_t icon_active,
                                uint32_t icon_disabled,
                                uint32_t bg_active,
                                uint32_t bg_disabled,
                                uint32_t title_active,
                                uint32_t title_disabled,
                                uint32_t value_active,
                                uint32_t value_disabled)
          {
            static lv_obj_t* cached_tiles[10] = {};
            static bool cached_active[10] = {};
            for (int i = 0; i < 10; ++i) {
              if (cached_tiles[i] == tile) {
                if (cached_active[i] == active) return;
                cached_active[i] = active;
                break;
              }
              if (cached_tiles[i] == nullptr) {
                cached_tiles[i] = tile;
                cached_active[i] = active;
                break;
              }
            }
            // ${ACCENT_AUTO} = "bepaal zelf"; een echte hexwaarde wint altijd.
            uint32_t accent = accent_for(entity_id);
            if (circle_active == ${ACCENT_AUTO}) circle_active = accent;
            if (icon_disabled == ${ACCENT_AUTO}) icon_disabled = accent;

            lv_obj_set_style_bg_color(tile, lv_color_hex(active ? bg_active : bg_disabled), 0);
            lv_obj_set_style_bg_color(circle, lv_color_hex(active ? circle_active : circle_disabled), 0);
            lv_obj_set_style_text_color(icon_lbl, lv_color_hex(active ? icon_active : icon_disabled), 0);
            lv_obj_set_style_text_color(title, lv_color_hex(active ? title_active : title_disabled), 0);
            lv_obj_set_style_text_color(value, lv_color_hex(active ? value_active : value_disabled), 0);
          };

          apply_tile(t1_on, "${TILE1_ENTITY}",
                    id(tile1), id(tile1_icon_circle), id(t1_title), id(t1_value), id(tile1_icon_lbl),
                    ${TILE1_CIRCLE_ACTIVE_COLOR}, ${TILE1_CIRCLE_DISABLED_COLOR},
                    ${TILE1_ICON_ACTIVE_COLOR}, ${TILE1_ICON_DISABLED_COLOR},
                    ${TILE1_BG_ACTIVE_COLOR}, ${TILE1_BG_DISABLED_COLOR},
                    ${TILE1_TITLE_ACTIVE_COLOR}, ${TILE1_TITLE_DISABLED_COLOR},
                    ${TILE1_VALUE_ACTIVE_COLOR}, ${TILE1_VALUE_DISABLED_COLOR});

          apply_tile(t2_on, "${TILE2_ENTITY}",
                    id(tile2), id(tile2_icon_circle), id(t2_title), id(t2_value), id(tile2_icon_lbl),
                    ${TILE2_CIRCLE_ACTIVE_COLOR}, ${TILE2_CIRCLE_DISABLED_COLOR},
                    ${TILE2_ICON_ACTIVE_COLOR}, ${TILE2_ICON_DISABLED_COLOR},
                    ${TILE2_BG_ACTIVE_COLOR}, ${TILE2_BG_DISABLED_COLOR},
                    ${TILE2_TITLE_ACTIVE_COLOR}, ${TILE2_TITLE_DISABLED_COLOR},
                    ${TILE2_VALUE_ACTIVE_COLOR}, ${TILE2_VALUE_DISABLED_COLOR});

          apply_tile(t3_on, "${TILE3_ENTITY}",
                    id(tile3), id(tile3_icon_circle), id(t3_title), id(t3_value), id(tile3_icon_lbl),
                    ${TILE3_CIRCLE_ACTIVE_COLOR}, ${TILE3_CIRCLE_DISABLED_COLOR},
                    ${TILE3_ICON_ACTIVE_COLOR}, ${TILE3_ICON_DISABLED_COLOR},
                    ${TILE3_BG_ACTIVE_COLOR}, ${TILE3_BG_DISABLED_COLOR},
                    ${TILE3_TITLE_ACTIVE_COLOR}, ${TILE3_TITLE_DISABLED_COLOR},
                    ${TILE3_VALUE_ACTIVE_COLOR}, ${TILE3_VALUE_DISABLED_COLOR});

          apply_tile(t4_on, "${TILE4_ENTITY}",
                    id(tile4), id(tile4_icon_circle), id(t4_title), id(t4_value), id(tile4_icon_lbl),
                    ${TILE4_CIRCLE_ACTIVE_COLOR}, ${TILE4_CIRCLE_DISABLED_COLOR},
                    ${TILE4_ICON_ACTIVE_COLOR}, ${TILE4_ICON_DISABLED_COLOR},
                    ${TILE4_BG_ACTIVE_COLOR}, ${TILE4_BG_DISABLED_COLOR},
                    ${TILE4_TITLE_ACTIVE_COLOR}, ${TILE4_TITLE_DISABLED_COLOR},
                    ${TILE4_VALUE_ACTIVE_COLOR}, ${TILE4_VALUE_DISABLED_COLOR});

          apply_tile(t5_on, "${TILE5_ENTITY}",
                    id(tile5), id(tile5_icon_circle), id(t5_title), id(t5_value), id(tile5_icon_lbl),
                    ${TILE5_CIRCLE_ACTIVE_COLOR}, ${TILE5_CIRCLE_DISABLED_COLOR},
                    ${TILE5_ICON_ACTIVE_COLOR}, ${TILE5_ICON_DISABLED_COLOR},
                    ${TILE5_BG_ACTIVE_COLOR}, ${TILE5_BG_DISABLED_COLOR},
                    ${TILE5_TITLE_ACTIVE_COLOR}, ${TILE5_TITLE_DISABLED_COLOR},
                    ${TILE5_VALUE_ACTIVE_COLOR}, ${TILE5_VALUE_DISABLED_COLOR});

          apply_tile(t6_on, "${TILE6_ENTITY}",
                    id(tile6), id(tile6_icon_circle), id(t6_title), id(t6_value), id(tile6_icon_lbl),
                    ${TILE6_CIRCLE_ACTIVE_COLOR}, ${TILE6_CIRCLE_DISABLED_COLOR},
                    ${TILE6_ICON_ACTIVE_COLOR}, ${TILE6_ICON_DISABLED_COLOR},
                    ${TILE6_BG_ACTIVE_COLOR}, ${TILE6_BG_DISABLED_COLOR},
                    ${TILE6_TITLE_ACTIVE_COLOR}, ${TILE6_TITLE_DISABLED_COLOR},
                    ${TILE6_VALUE_ACTIVE_COLOR}, ${TILE6_VALUE_DISABLED_COLOR});

          apply_tile(t7_on, "${TILE7_ENTITY}",
                    id(tile7), id(tile7_icon_circle), id(t7_title), id(t7_value), id(tile7_icon_lbl),
                    ${TILE7_CIRCLE_ACTIVE_COLOR}, ${TILE7_CIRCLE_DISABLED_COLOR},
                    ${TILE7_ICON_ACTIVE_COLOR}, ${TILE7_ICON_DISABLED_COLOR},
                    ${TILE7_BG_ACTIVE_COLOR}, ${TILE7_BG_DISABLED_COLOR},
                    ${TILE7_TITLE_ACTIVE_COLOR}, ${TILE7_TITLE_DISABLED_COLOR},
                    ${TILE7_VALUE_ACTIVE_COLOR}, ${TILE7_VALUE_DISABLED_COLOR});

          apply_tile(t8_on, "${TILE8_ENTITY}",
                    id(tile8), id(tile8_icon_circle), id(t8_title), id(t8_value), id(tile8_icon_lbl),
                    ${TILE8_CIRCLE_ACTIVE_COLOR}, ${TILE8_CIRCLE_DISABLED_COLOR},
                    ${TILE8_ICON_ACTIVE_COLOR}, ${TILE8_ICON_DISABLED_COLOR},
                    ${TILE8_BG_ACTIVE_COLOR}, ${TILE8_BG_DISABLED_COLOR},
                    ${TILE8_TITLE_ACTIVE_COLOR}, ${TILE8_TITLE_DISABLED_COLOR},
                    ${TILE8_VALUE_ACTIVE_COLOR}, ${TILE8_VALUE_DISABLED_COLOR});

          apply_tile(t9_on, "${TILE9_ENTITY}",
                    id(tile9), id(tile9_icon_circle), id(t9_title), id(t9_value), id(tile9_icon_lbl),
                    ${TILE9_CIRCLE_ACTIVE_COLOR}, ${TILE9_CIRCLE_DISABLED_COLOR},
                    ${TILE9_ICON_ACTIVE_COLOR}, ${TILE9_ICON_DISABLED_COLOR},
                    ${TILE9_BG_ACTIVE_COLOR}, ${TILE9_BG_DISABLED_COLOR},
                    ${TILE9_TITLE_ACTIVE_COLOR}, ${TILE9_TITLE_DISABLED_COLOR},
                    ${TILE9_VALUE_ACTIVE_COLOR}, ${TILE9_VALUE_DISABLED_COLOR});

          apply_tile(t10_on, "${TILE10_ENTITY}",
                    id(tile10), id(tile10_icon_circle), id(t10_title), id(t10_value), id(tile10_icon_lbl),
                    ${TILE10_CIRCLE_ACTIVE_COLOR}, ${TILE10_CIRCLE_DISABLED_COLOR},
                    ${TILE10_ICON_ACTIVE_COLOR}, ${TILE10_ICON_DISABLED_COLOR},
                    ${TILE10_BG_ACTIVE_COLOR}, ${TILE10_BG_DISABLED_COLOR},
                    ${TILE10_TITLE_ACTIVE_COLOR}, ${TILE10_TITLE_DISABLED_COLOR},
                    ${TILE10_VALUE_ACTIVE_COLOR}, ${TILE10_VALUE_DISABLED_COLOR});

# HA blueprint transport; never publishes the JSON command as an HA state.
text:
  - platform: smart_display
    id: dashboard_inbox
    name: "Tegelinstellingen"
    internal: ${DASHBOARD_INBOX_INTERNAL}

number:
  - platform: template
    id: setting_brightness
    name: "Helderheid normaal"
    entity_category: config
    min_value: 5
    max_value: 100
    step: 1
    unit_of_measurement: "%"
    update_interval: 2s
    lambda: return screen_settings::current.brightness;
