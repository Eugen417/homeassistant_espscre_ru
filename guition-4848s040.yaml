# Guition ESP32-S3-4848S040 / 4-inch EU wallbox, 480x480 IPS + GT911.
# Use guition-device.yaml; see docs/GUITION.md. CYD hardware is a separate profile.
substitutions:
  SCREEN_FIRMWARE_VERSION: "0.2.20"
  DYNAMIC_TILES: "false"
  DASHBOARD_INBOX_INTERNAL: "true"
  DEVICE_NAME: "guition-wallbox"
  DEVICE_FRIENDLY_NAME: "Guition Wallbox"
  CALIBRATION_ON_BOOT: "false"

  TILE_COUNT: "6"                                # 1-10; <=6 hides page navigation

  DIRECT_ACTIONS: "false"                           # true = call Home Assistant services directly, false = only emit action events
  ROOM_NAME: "Woonkamer"                              # room name shown in the top-left header
  TIME_24H: "true"                                 # true = 24h format, false = 12h format

  ## DIM settings
  AUTO_DIM: "true"                                 # true = enable auto dimming
  AUTO_DIM_TIMEOUT: "600"                           # seconds after last touch
  MAX_BRIGHTNESS: "100"                            # backlight brightness in percent
  DIM_BRIGHTNESS: "20"                             # dimmed backlight brightness in percent
  NIGHT_MODE: "true"                               # true = use separate dim level at night
  NIGHT_START_HOUR: "22"                           # 0-23
  NIGHT_END_HOUR: "7"                              # 0-23
  NIGHT_DIM_BRIGHTNESS: "10"                       # backlight brightness in percent at night

  # ============================================================
  # ACCENTKLEUREN — automatisch bepaald uit het Home Assistant-domein
  #
  # Het domein is het stuk voor de punt in het entity_id:
  #   script.goede_morgen  -> "script"  -> ACCENT_ACTION
  #   light.woonkamer_2    -> "light"   -> ACCENT_LIGHT
  #   vacuum.s8            -> "vacuum"  -> ACCENT_DEVICE
  #
  # Dat is Home Assistant's eigen indeling, dus een tegel krijgt vanzelf de
  # juiste kleur zodra je er een entity in zet — je hoeft per tegel geen
  # kleuren meer te kiezen. Het onderscheid dat telt: een script/scene vuur
  # je af, een apparaat zet je aan of uit. Die twee horen niet hetzelfde
  # te zijn.
  #
  # Zet TILE*_CIRCLE_ACTIVE_COLOR / TILE*_ICON_DISABLED_COLOR op
  # ${ACCENT_AUTO} om dit te gebruiken, of op een echte hexwaarde om die
  # ene tegel handmatig te kleuren (zie tegel 8 — rood zodra er post ligt).
  # ============================================================
  ACCENT_AUTO: "0x1000000"                         # sentinel: bewust buiten het 24-bits kleurbereik
  ACCENT_ACTION: "0x8B5CF6"                        # script / scene / button / input_button / automation
  ACCENT_LIGHT: "0xFEC600"                         # light
  ACCENT_DEVICE: "0x00C5EC"                        # switch, fan, cover, climate, vacuum, media_player, rest

