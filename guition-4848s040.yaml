                  bg_color: 0xFFFFFF
                  bg_opa: 100%
                  radius: 42
                  # Enige widget met ZOWEL radius ALS een kind (overlay_icon).
                  # LVGL snijdt kinderen dan bij op de ronding, en dat kan
                  # alleen via een ARGB-laag van 96x160 = 46KB aaneengesloten.
                  # Lukt die allocatie niet, dan blijft LVGL het proberen tot
                  # de task watchdog het bord herstart. Ronding blijft, het
                  # bijsnijden gaat eraf.
                  clip_corner: false
                  border_width: 0

