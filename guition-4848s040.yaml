  TILE1_TYPE: "light"                              # tile type: light | fan | switch | scene | script | cover | climate
  TILE1_TAP_ACTION: "auto"                         # tap action: auto | toggle | activate | fan_toggle_preset | custom
  TILE1_LONGPRESS: "slider"                        # long press mode: none | slider | action
  TILE1_VALUE_MODE: "auto"                         # value mode: auto | brightness | percentage | preset | text
  TILE1_LABEL_OFF: "Uit"                           # text shown when entity is off
  TILE1_LABEL_ON: "Aan"                             # text shown for text-mode tiles when entity is on
  TILE1_ACTIVE_STATE: ""                           # optional: exact HA state that counts as "active" (empty = default "on")

