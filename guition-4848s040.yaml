  - platform: restart
    name: "Restart"

# Two SPI buses used by the CYD:
# - lcd: built-in display
# - my_touchscreen: built-in touch controller
# Pinout from ESPHome's GUITION-4848S040 preset. No relay outputs are configured.
spi:
  id: lcd
  clk_pin: GPIO48
  mosi_pin: GPIO47

i2c:
  id: touch_bus
  sda: GPIO19
  scl:
    number: GPIO45
    ignore_strapping_warning: true
  scan: true

output:
  - platform: ledc
    pin: GPIO38
    id: gpio_backlight_pwm
    frequency: 20000Hz

light:
  - platform: monochromatic
    output: gpio_backlight_pwm
    name: "Display Backlight"
    id: back_light
    restore_mode: ALWAYS_ON
    default_transition_length: 150ms

touchscreen:
  platform: gt911
  id: ts_touch
  i2c_id: touch_bus
  display: my_display
  update_interval: 20ms
  transform:
    swap_xy: ${TOUCH_SWAP_XY}
    mirror_x: ${TOUCH_MIRROR_X}
    mirror_y: ${TOUCH_MIRROR_Y}
  on_touch:
    - lambda: |-
        id(last_touch_ms) = millis();
        id(touch_down) = true;
        cyd::touch_guard.begin(millis(), touch.x, touch.y);
        ESP_LOGI("touch", "GT911 press x=%u y=%u test=%d", touch.x, touch.y, id(calibration_active));
  on_update:
    - lambda: |-
        id(last_touch_ms) = millis();
        for (const auto &point : touches) {
          cyd::touch_guard.update(point.x, point.y);
        }
  on_release:
    - lambda: |-
        id(last_touch_ms) = millis();
        id(touch_down) = false;


# Native ESPHome driver with the working manufacturer's LVGL demo timings.
# See docs/GUITION_FACTORY_REFERENCE.md; no custom RGB component is required.
display:
  - platform: st7701s
    id: my_display
    dimensions: {width: 480, height: 480}
    spi_id: lcd
    spi_mode: MODE0
    data_rate: 2MHz
    color_order: RGB
    invert_colors: false
    cs_pin: 39
    de_pin: 18
    hsync_pin: 16
    vsync_pin: 17
    pclk_pin: 21
    pclk_frequency: 16MHz
    pclk_inverted: false
    hsync_front_porch: 10
    hsync_pulse_width: 8
    hsync_back_porch: 50
    vsync_front_porch: 10
    vsync_pulse_width: 8
    vsync_back_porch: 20
    transform:
      mirror_x: false
      mirror_y: false
    init_sequence:
      - 1
      # Manufacturer's 16-bit bus configuration and normal scan direction.
      - [0xFF, 0x77, 0x01, 0x00, 0x00, 0x10]
      - [0xCD, 0x00]
      - [0xC7, 0x00]
      # Return to the standard register bank before pixel format / sleep-out.
      - [0xFF, 0x77, 0x01, 0x00, 0x00, 0x00]
      - [0x3A, 0x60]
      - [0x36, 0x00]
      - [0x20]
      - [0x11]
      - delay 120ms
    data_pins:
      red: [11, 12, 13, 14, 0]
      green: [8, 20, 3, 46, 9, 10]
      blue: [4, 5, 6, 7, 15]
    update_interval: never
    auto_clear_enabled: false


lvgl:
  id: screen_lvgl
  on_draw_start:
    - lambda: 'id(rendered_frames)++;'
  displays:
    - my_display
  touchscreens:
    - touchscreen_id: ts_touch

  # S3 octal PSRAM holds RGB framebuffer and LVGL draw buffers.
  buffer_size: 25%

  # Directe lokale feedback op de HELE UI, niet alleen op de tegels.
  # Een thema zet de stijl per widget-type, dus dit dekt in een klap alle
  # knoppen, tabs, sliders en de thermostaatring. Niet-klikbare widgets
  # komen nooit in de pressed-state, dus die blijven onaangeroerd.
  theme:
    obj:
      pressed:
        # bg_opa en NIET opa: `opa` op widget-niveau dwingt LVGL het element
        # naar een aparte laag te renderen, en die laag kost tientallen KB's
        # per ingedrukte widget. Dat liep hier het geheugen uit.
        bg_opa: 45%
    slider:
      knob:
        pressed:
          bg_opa: 65%
    arc:
      knob:
        pressed:
          bg_opa: 65%

  # LVGL owns the rotation (display + touch) since ESPHome 2026.4.
  rotation: ${LVGL_ROTATION}

  style_definitions:
    # Achtergrond: twee-stops verticale gradient in plaats van de 320x240
    # RGB565-wallpaper. Scheelt ~150 KB flash en een image-blit per hertekening,
    # wat je direct terugziet in de vloeiendheid van het scrollen.
    - id: style_bg_grad
      bg_color: ${BG_TOP_COLOR}
      bg_grad_color: ${BG_BOTTOM_COLOR}
      bg_grad_dir: VER
      bg_opa: COVER
      border_width: 0
      radius: 0

    - id: style_tile
      bg_color: 0xFFFFFF
      bg_opa: COVER
      radius: 22
      border_width: 1
      border_color: 0xDDDDDD
      border_opa: COVER
      pad_left: 12
      pad_right: 12
      pad_top: 12
      pad_bottom: 12
      shadow_width: 0
      shadow_opa: 40%

    - id: style_tile_disabled
      bg_color: 0xFFFFFF
      bg_opa: COVER
      radius: 22
      border_width: 1
      border_color: 0xDDDDDD
      border_opa: COVER
      pad_left: 12
      pad_right: 12
      pad_top: 12
      pad_bottom: 12
      shadow_width: 0
      shadow_opa: 25%

    - id: style_icon_circle
      bg_color: 0xD5EEFC
      bg_opa: COVER
      radius: 999
      border_width: 0

    - id: style_icon_circle_disabled
      bg_color: 0xEEEEEE
      bg_opa: COVER
      radius: 999
      border_width: 0

    - id: style_room
      text_font: headline
      text_color: 0x1B1B1B
      text_opa: 100%

    - id: style_time
      text_font: time_label
      text_color: 0x1B1B1B
      text_opa: 100%

    - id: style_title
      text_font: label
      text_color: 0x000000
      text_opa: 100%

    - id: style_value
      text_font: sublabel
      text_color: 0x7A7A7C
      text_opa: 100%

    - id: style_value_big
      text_font: sublabel_big
      text_color: 0x1B1B1B
      text_opa: 80%

    - id: style_title_disabled
      text_font: label
      text_color: 0x1B1B1B
      text_opa: 100%

    - id: style_value_disabled
      text_font: sublabel
      text_color: 0x1B1B1B
      text_opa: 100%

  pages:
    - id: home_page
      styles: style_bg_grad
      pad_all: 0
      scrollable: false
      scrollbar_mode: 'OFF'
      widgets:
        # Never shown: it only makes ESPHome compile LVGL's spinner, which the busy sheet on a tile draws.
        - spinner:
            id: busy_spinner_seed
            hidden: true
            width: 2
            height: 2
            spin_time: 1s
            arc_length: 60deg
        - label:
            id: lbl_room
            x: 16
            y: ${HEADER_Y}
            text: "${ROOM_NAME}"
            styles: style_room

        # Enables LVGL's line widget for the runtime clock hands and sparklines.
        - line:
            id: runtime_line_enable
            hidden: true
            points:
              - 0, 0
              - 1, 1

        - label:
            id: lbl_time
            align: TOP_RIGHT
            x: -16
            y: ${HEADER_Y}
            text: ""
            styles: style_time

        # Six tiles on page 1, four on page 2. Fixed pages keep navigation predictable.
        - obj:
            id: tile_scroll
            x: 0
            y: ${SCROLL_Y}
            width: ${DISPLAY_W}
            height: ${SCROLL_H}
            bg_opa: TRANSP
            border_width: 0
            pad_left: 0
            pad_right: 0
            pad_top: 0
            pad_bottom: 0
            scrollable: false
            scrollbar_mode: 'OFF'
            widgets:
              # ---------- TILE 1 ----------
              - obj:
                  id: tile1
                  x: ${GRID_COL1_X}
                  y: ${GRID_ROW1_Y}
                  width: ${TILE_W}
                  height: ${TILE_H}
                  styles: style_tile
                  scrollable: false
                  scrollbar_mode: 'OFF'
                  # Directe lokale feedback: LVGL past dit toe zodra de vinger het
                  # glas raakt, in dezelfde frame. Onafhankelijk van Home Assistant.
                  pressed:
                    bg_opa: 45%
                  widgets:
                    - obj:
                        id: tile1_icon_circle
                        x: ${TILE_ICON_X}
                        y: ${TILE_ICON_Y}
                        width: 54
                        height: 54
                        styles: style_icon_circle
                        clickable: false
                        scrollable: false
                        scrollbar_mode: 'OFF'
                        widgets:
                          - label:
                              id: tile1_icon_lbl
                              align: CENTER
                              text_font: materialdesign_icons
                              text_color: 0x1B1B1B
                              text: "${TILE1_ICON}"
                              clickable: false
                    - label:
                        id: t1_title
                        height: 24
                        width: 130
                        long_mode: DOT
                        x: ${TILE_TITLE_X}
                        y: ${TILE_TITLE_Y}
                        text: "${TILE1_TITLE}"
                        styles: style_title
                        clickable: false
                    - label:
                        id: t1_value
                        height: 22
                        width: 130
                        long_mode: DOT
                        x: ${TILE_VALUE_X}
                        y: ${TILE_VALUE_Y}
                        text: "—"
                        styles: style_value
                        clickable: false
                  on_short_click:
                    - if:
                        condition:
                          lambda: 'return !runtime_tiles::enabled && cyd::touch_guard.accept(millis(), 1);'
                        then:
                          - script.execute: { id: publish_action, action: "tile1_press" }
                          - script.execute:
                              id: do_tile_action
                              tile_type: "${TILE1_TYPE}"
                              tap_action: "${TILE1_TAP_ACTION}"
                              service: "${TILE1_TAP_SERVICE}"
                              entity_id: "${TILE1_ENTITY}"
                              param_key: "${TILE1_TAP_PARAM_KEY}"
                              param_val: "${TILE1_TAP_PARAM_VAL}"
                              was_on: !lambda |-
                                if (std::string("${TILE1_TYPE}") == "cover")
                                  return id(tile1_cover_state).state != "closed";
                                return std::string(id(ha_state_tile1).state.c_str()) == "on";
                  on_long_press:
                    - if:
                        condition:
                          lambda: 'return !runtime_tiles::enabled && cyd::touch_guard.accept(millis(), 1);'
                        then:
                          - script.execute: { id: publish_action, action: "tile1_long_press" }
                          - if:
                              condition:
                                lambda: "return std::string(\"${TILE1_LONGPRESS}\") == \"action\";"
                              then:
                                - script.execute:
                                    id: do_tile_action
                                    tile_type: !lambda |-
                                      std::string t = "${TILE1_LONGPRESS_ACTION_TYPE}";
                                      return t.empty() ? std::string("${TILE1_TYPE}") : t;
                                    tap_action: "activate"
                                    service: "${TILE1_LONGPRESS_ACTION_SERVICE}"
                                    entity_id: "${TILE1_LONGPRESS_ACTION}"
                                    param_key: ""
                                    param_val: ""
                                    was_on: false
                              else:
                                - if:
                                    condition:
                                      lambda: "return std::string(\"${TILE1_LONGPRESS}\") == \"slider\";"
                                    then:
                                      - script.execute:
                                          id: open_value_overlay
                                          title: "${TILE1_TITLE}"
                                          entity: "${TILE1_ENTITY}"
                                          tile_type: "${TILE1_TYPE}"
                                          longpress_mode: "${TILE1_LONGPRESS_SLIDER}"
                                          was_on: !lambda |-
                                            if (std::string("${TILE1_TYPE}") == "cover")
                                              return id(tile1_cover_state).state != "closed";
                                            return std::string(id(ha_state_tile1).state.c_str()) == "on";
                                          off_value: !lambda "return atoi(\"${TILE1_LONGPRESS_OFF_VALUE}\");"
                                          brightness_value: !lambda "return id(tile1_brightness).state;"
                                          percentage_value: !lambda "return id(tile1_percentage).state;"
                                          position_value: !lambda "return id(tile1_cover_position).state;"
                                          icon_text: "${TILE1_ICON}"
                                          slider_bg_color: ${TILE1_BG_DISABLED_COLOR}
                                          slider_fill_color: ${TILE1_CIRCLE_ACTIVE_COLOR}
                                          slider_icon_color: ${TILE1_ICON_ACTIVE_COLOR}
                                          label_off: "${TILE1_LABEL_OFF}"
                                          label_on: "${TILE1_LABEL_ON}"
                                          supported_color_modes: !lambda "return std::string(id(tile1_supported_color_modes).state.c_str());"
                                          climate_current_temperature: !lambda "return id(tile1_climate_current_temperature).state;"
                                          climate_target_temperature: !lambda "return id(tile1_climate_target_temperature).state;"
                                          climate_humidity: !lambda "return id(tile1_climate_humidity).state;"
                                          climate_mode: !lambda "return std::string(id(tile1_climate_mode).state.c_str());"
                                          climate_supported_modes: !lambda "return std::string(id(tile1_climate_supported_modes).state.c_str());"
                                          climate_min_temp: "${TILE1_CLIMATE_MIN_TEMP}"
                                          climate_max_temp: "${TILE1_CLIMATE_MAX_TEMP}"
                                          climate_step: "${TILE1_CLIMATE_STEP}"
                          # Long-press modus "vacuum": opent de stofzuigerbediening.
                          # Valt buiten de action/slider-keten, dus die blijft ongewijzigd.
                          - if:
                              condition:
                                lambda: "return std::string(\"${TILE1_LONGPRESS}\") == \"vacuum\";"
                              then:
                                - script.execute:
                                    id: open_vacuum_overlay
                                    title: "${TILE1_TITLE}"
                                    entity: "${TILE1_ENTITY}"

